: 28, "title": "28. summation 함수의 코드와 그래프 해석", "kind": 1, "code": "import sympy as sp\nimport numpy as np\nimport matplotlib.pyplot as plt\nx = sp.symbols('x', real=True)\nk = sp.symbols('k', integer=True)\nf = x\nresult = sp.summation(k*x,(k,1,4))\nprint('summation 결과:', result)\n# 그래프에 사용할 식\nplot_expr = result if True else f\nxs = np.linspace(-4, 4, 1000)\nfn = sp.lambdify(x, plot_expr, 'numpy')\nwith np.errstate(all='ignore'):\n    ys = np.asarray(fn(xs), dtype=float)\n    if ys.ndim == 0: ys = np.full_like(xs, ys)\n    ys[~np.isfinite(ys)] = np.nan\n    ys[np.abs(ys)>40] = np.nan\nplt.plot(xs, ys, label=str(plot_expr))\nplt.axhline(0, color='gray', lw=.7)\nplt.axvline(0, color='gray', lw=.7)\nplt.grid(alpha=.3)\nplt.legend()\nplt.tight_layout()\nplt.savefig('sympy_quiz_28.png', dpi=150)\nplt.show()", "opts": [{"text": "합으로 만든 기호식도 그래프로 그릴 수 있다", "correct": true, "why": "코드의 summation 동작 및 그래프 성질에 부합합니다."}, {"text": "1부터 4까지 k의 합은 10이다", "correct": true, "why": "코드의 summation 동작 및 그래프 성질에 부합합니다."}, {"text": "summation은 기호 합을 계산한다", "correct": true, "why": "코드의 summation 동작 및 그래프 성질에 부합합니다."}, {"text": "이 코드에서 결과는 10*x이다", "correct": true, "why": "코드의 summation 동작 및 그래프 성질에 부합합니다."}, {"text": "합의 상한 4는 x의 최대값을 뜻한다", "correct": false, "why": "코드의 summation 동작 또는 수학적 성질에 부합하지 않습니다."}], "answer": [4]}, {"id": 29, "title": "29. product 함수의 코드와 그래프 해석", "kind": 1, "code": "import sympy as sp\nimport numpy as np\nimport matplotlib.pyplot as plt\nx = sp.symbols('x', real=True)\nk = sp.symbols('k', integer=True)\nf = x\nresult = sp.product(k+x,(k,1,3))\nprint('product 결과:', result)\n# 그래프에 사용할 식\nplot_expr = result if True else f\nxs = np.linspace(-4, 4, 1000)\nfn = sp.lambdify(x, plot_expr, 'numpy')\nwith np.errstate(all='ignore'):\n    ys = np.asarray(fn(xs), dtype=float)\n    if ys.ndim == 0: ys = np.full_like(xs, ys)\n    ys[~np.isfinite(ys)] = np.nan\n    ys[np.abs(ys)>40] = np.nan\nplt.plot(xs, ys, label=str(plot_expr))\nplt.axhline(0, color='gray', lw=.7)\nplt.axvline(0, color='gray', lw=.7)\nplt.grid(alpha=.3)\nplt.legend()\nplt.tight_layout()\nplt.savefig('sympy_quiz_29.png', dpi=150)\nplt.show()", "opts": [{"text": "세 인수의 영점은 -1,-2,-3이다", "correct": true, "why": "코드의 product 동작 및 그래프 성질에 부합합니다."}, {"text": "product는 합을 계산한다", "correct": false, "why": "코드의 product 동작 또는 수학적 성질에 부합하지 않습니다."}, {"text": "결과는 (x+1)*(x+2)*(x+3)이다", "correct": true, "why": "코드의 product 동작 및 그래프 성질에 부합합니다."}, {"text": "product는 기호 곱을 계산한다", "correct": true, "why": "코드의 product 동작 및 그래프 성질에 부합합니다."}, {"text": "곱 결과는 다항식으로 전개할 수 있다", "correct": true, "why": "코드의 product 동작 및 그래프 성질에 부합합니다."}], "answer": [1]}, {"id": 30, "title": "30. Matrix.det 함수의 코드와 그래프 해석", "kind": 1, "code": "import sympy as sp\nimport numpy as np\nimport matplotlib.pyplot as plt\nx = sp.symbols('x', real=True)\nk = sp.symbols('k', integer=True)\nf = x\nresult = sp.Matrix([[x,1],[1,x]]).det()\nprint('Matrix.det 결과:', result)\n# 그래프에 사용할 식\nplot_expr = result if True else f\nplot_expr = result\nxs = np.linspace(-4, 4, 1000)\nfn = sp.lambdify(x, plot_expr, 'numpy')\nwith np.errstate(all='ignore'):\n    ys = np.asarray(fn(xs), dtype=float)\n    if ys.ndim == 0: ys = np.full_like(xs, ys)\n    ys[~np.isfinite(ys)] = np.nan\n    ys[np.abs(ys)>40] = np.nan\nplt.plot(xs, ys, label=str(plot_expr))\nplt.axhline(0, color='gray', lw=.7)\nplt.axvline(0, color='gray', lw=.7)\nplt.grid(alpha=.3)\nplt.legend()\nplt.tight_layout()\nplt.savefig('sympy_quiz_30.png', dpi=150)\nplt.show()", "opts": [{"text": "행렬식도 x의 함수로 그래프를 그릴 수 있다", "correct": true, "why": "코드의 Matrix.det 동작 및 그래프 성질에 부합합니다."}, {"text": "행렬식이 0인 x는 -1과 1이다", "correct": true, "why": "코드의 Matrix.det 동작 및 그래프 성질에 부합합니다."}, {"text": "det는 행렬식을 계산한다", "correct": true, "why": "코드의 Matrix.det 동작 및 그래프 성질에 부합합니다."}, {"text": "행렬식은 x**2+1이다", "correct": false, "why": "코드의 Matrix.det 동작 또는 수학적 성질에 부합하지 않습니다."}, {"text": "행렬식은 x**2-1이다", "correct": true, "why": "코드의 Matrix.det 동작 및 그래프 성질에 부합합니다."}], "answer": [3]}]</script><script>
const Q=JSON.parse(document.getElementById('data').textContent),L=['①','②','③','④','⑤'];let last=null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('qs').innerHTML=Q.map(q=>`<article class="q" id="q${q.id}"><div class="bar"><h2>${esc(q.title)}</h2><span>${q.id<=10?'옳은 것 1개':q.id<=20?'옳은 것 2개':'틀린 것 1개'} 고르기</span></div><div class="bar"><b>독립 실행 Python 그래프 출력 코드</b><button onclick="copyCode(${q.id},this)">코드 복사</button></div><pre>${esc(q.code)}</pre><p><b>다음 설명 중 ${q.id<=10?'옳은 것 하나':q.id<=20?'옳은 것 두 개':'틀린 것 하나'}를 고르시오.</b></p>${q.opts.map((o,j)=>`<label class="opt"><input type="${q.kind===2?'checkbox':'radio'}" name="a${q.id}" value="${j}" onchange="progress()"> ${L[j]} ${esc(o.text)}</label>`).join('')}<div class="ex" id="e${q.id}"></div></article>`).join('');
function selected(q){return [...document.querySelectorAll(`[name="a${q.id}"]:checked`)].map(e=>+e.value).sort()}
function progress(){document.getElementById('progress').textContent=Q.filter(q=>selected(q).length).length+'/30 응답'}
function grade(){let n=0;Q.forEach(q=>{let ans=selected(q),ok=JSON.stringify(ans)===JSON.stringify(q.answer);if(ok)n++;let e=document.getElementById('e'+q.id);e.classList.add('show');e.innerHTML=`<b>${ok?'정답':'오답'} · 정답 ${q.answer.map(i=>L[i]).join(', ')}</b>`+q.opts.map((o,j)=>`<p>${L[j]} ${o.correct?'옳은 설명':'틀린 설명'}: ${esc(o.text)} — ${esc(o.why)}</p>`).join('')});last=n;document.getElementById('score').textContent='총점 '+n+'/30점';scrollTo({top:0,behavior:'smooth'})}
async function copyCode(id,b){let s=Q[id-1].code;try{await navigator.clipboard.writeText(s)}catch(e){let t=document.createElement('textarea');t.value=s;document.body.append(t);t.select();document.execCommand('copy');t.remove()}b.textContent='복사 완료';setTimeout(()=>b.textContent='코드 복사',1200)}
function save(){if(last===null)grade();let sid=document.getElementById('sid').value.trim()||'학번미입력',name=document.getElementById('student').value.trim()||'이름미입력',now=new Date(),stamp=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('')+'_'+[now.getHours(),now.getMinutes(),now.getSeconds()].map(x=>String(x).padStart(2,'0')).join('');let lines=['SymPy 함수별 코드 분석 30문항','학번: '+sid,'이름: '+name,'점수: '+last+'/30','응시시각: '+now.toLocaleString('ko-KR'),...Q.map(q=>`${q.id}번 응답: ${selected(q).map(i=>L[i]).join(',')||'미응답'} / 정답: ${q.answer.map(i=>L[i]).join(',')} / ${JSON.stringify(selected(q))===JSON.stringify(q.answer)?'정답':'오답'}`)];let a=document.createElement('a'),blob=new Blob(['\uFEFF'+lines.join('\n')],{type:'text/plain;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download=`${sid}_${name}_${last}점_SymPy_${stamp}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
</script></body></html>
