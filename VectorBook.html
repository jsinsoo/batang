<!doctype html><html lang="ko"><meta charset="utf-8"><title>벡터해석 100개념 한영 낭독 이북</title><style>body{background:#0b1730;color:white;font-family:'Malgun Gothic',sans-serif;margin:0}main{max-width:1000px;margin:4vh auto;background:#152747;padding:40px;border-radius:22px}h1{color:#7dd3fc}.ko{font-size:27px;line-height:1.7}.en{font-size:23px;color:#c5e9ff;line-height:1.6}.math{background:#203c63;padding:25px;border-radius:12px;font-size:28px}button,input{font-size:18px;padding:12px;margin:6px}small{color:#fbbf24}</style><main><h1>벡터해석의 노래 — 100개 개념 낭독 이북</h1><p>한국어 남성 음성 → 영어 여성 음성 순서로 낭독합니다. 실제 음성은 컴퓨터에 설치된 음성에 따라 달라집니다.</p><div><button onclick="play()">▶ 연속 낭독</button><button onclick="stop()">■ 정지</button><button onclick="prev()">◀ 이전</button><button onclick="next()">다음 ▶</button><label>속도 <input id="rate" type="range" min="0.65" max="1.4" value="0.9" step="0.05"></label></div><h2 id="title"></h2><small id="counter"></small><p class="ko" id="ko"></p><p class="en" id="en"></p><h3>개념 핵심 수학식</h3><p class="math" id="math"></p></main><script>const items=[{"n": 1, "title": "스칼라와 벡터", "ko": "나는 스칼라, 크기만 말해! 나는 벡터, 방향까지 품어 세상을 달려!", "en": "I am Scalar, magnitude alone! I am Vector, racing with direction through the world!", "formula": "v = (vₓ, vᵧ, vᵤ)"}, {"n": 2, "title": "벡터의 크기와 방향", "ko": "내 길이는 힘의 세기, 화살촉은 나의 길!", "en": "My length tells the strength of force; my arrowhead points the way!", "formula": "|v| = √(vₓ² + vᵧ² + vᵤ²)"}, {"n": 3, "title": "벡터의 덧셈과 뺄셈", "ko": "머리와 꼬리 이어 붙여, 빼기는 반대 방향으로 춤춰!", "en": "Join head to tail to add; to subtract, dance the opposite way!", "formula": "a + b = (aₓ+bₓ, aᵧ+bᵧ, aᵤ+bᵤ)"}, {"n": 4, "title": "벡터의 실수배와 선형결합", "ko": "숫자를 곱해 몸집 바꾸고, 여럿이 합쳐 새 길을 만들지!", "en": "Multiply me by a number to change my size; combine us to make a new path!", "formula": "c₁a + c₂b"}, {"n": 5, "title": "위치벡터와 단위벡터", "ko": "원점에서 출발하는 나, 단위벡터는 길이 하나의 길잡이!", "en": "I start at the origin; a unit vector guides with length exactly one!", "formula": "û = v / |v|"}, {"n": 6, "title": "벡터의 성분과 좌표 표현", "ko": "엑스 와이 제트 세 발자국, 내 방향을 숫자로 들려줘!", "en": "Three steps in X, Y, and Z; let numbers sing my direction!", "formula": "v = vₓi + vᵧj + vᵤk"}, {"n": 7, "title": "벡터의 내적", "ko": "나는 내적, 코사인으로 친밀도를 재고 직각이면 영이 되지!", "en": "I am the dot product; cosine measures alignment, and right angles give zero!", "formula": "a · b = |a||b| cos θ"}, {"n": 8, "title": "벡터의 외적", "ko": "나는 외적, 두 벡터에 수직으로 솟아 면적까지 품어!", "en": "I am the cross product, rising perpendicular, carrying area in my arms!", "formula": "|a × b| = |a||b| sin θ"}, {"n": 9, "title": "스칼라 삼중곱과 벡터 삼중곱", "ko": "셋이 만나 부피를 말하고, 괄호 순서엔 주의하라!", "en": "Three vectors reveal volume; beware the order of parentheses!", "formula": "V = |a · (b × c)|"}, {"n": 10, "title": "벡터의 정사영과 직교분해", "ko": "빛을 비춰 그림자를 찾고, 나란한 몫과 수직 몫으로 나눠!", "en": "Shine a light to find my shadow; split me into parallel and perpendicular parts!", "formula": "projᵤ v = (v·u / |u|²)u"}, {"n": 11, "title": "3차원 직교좌표계", "ko": "세 축이 서로 직각으로 서서 공간의 주소를 부르네!", "en": "Three mutually perpendicular axes call out every address in space!", "formula": "P = (x, y, z)"}, {"n": 12, "title": "공간에서 직선의 방정식", "ko": "한 점과 방향 하나면, 끝없이 곧게 뻗어 가지!", "en": "Give me a point and a direction; I stretch straight into infinity!", "formula": "r(t) = r₀ + tv"}, {"n": 13, "title": "평면의 방정식", "ko": "법선벡터 하나 들고, 넓고 평평한 무대를 펼쳐!", "en": "With one normal vector, I spread a broad and level stage!", "formula": "ax + by + cz = d"}, {"n": 14, "title": "평면 사이의 거리", "ko": "가장 짧은 길은 수선, 멀리 돌아갈 필요 없어!", "en": "The shortest distance is perpendicular; no need to take the long way!", "formula": "d = |n·(P−P₀)| / |n|"}, {"n": 15, "title": "직선과 평면의 교점 및 교각", "ko": "만나는 자리를 풀어내고, 기울어진 각도를 밝혀!", "en": "Solve for where line meets plane, and reveal their angle!", "formula": "n · (r₀ + tv) = d"}, {"n": 16, "title": "원기둥좌표계", "ko": "반지름과 각도, 높이 셋으로 원통 속을 여행해!", "en": "Radius, angle, and height take me through a cylindrical world!", "formula": "x = r cos θ, y = r sin θ"}, {"n": 17, "title": "구면좌표계", "ko": "반지름과 두 각도로, 둥근 우주의 주소를 적어!", "en": "A radius and two angles write the address of a spherical universe!", "formula": "x = ρ sin φ cos θ"}, {"n": 18, "title": "좌표변환과 야코비안", "ko": "좌표를 갈아입을 땐 부피 비율 야코비안을 챙겨!", "en": "When changing coordinates, bring the Jacobian to scale the volume!", "formula": "dV = |J| du dv dw"}, {"n": 19, "title": "벡터값 함수의 정의", "ko": "시간을 넣으면 벡터가 나와, 내 궤적은 살아 있는 노래!", "en": "Feed me time and I return a vector; my trajectory is a living song!", "formula": "r(t) = (x(t), y(t), z(t))"}, {"n": 20, "title": "벡터값 함수의 극한과 연속", "ko": "다가가도 끊어지지 않으면, 매끄러운 만남을 약속해!", "en": "Approach without a jump; continuity promises a seamless meeting!", "formula": "lim r(t) = (lim x, lim y, lim z)"}, {"n": 21, "title": "벡터값 함수의 미분", "ko": "성분마다 미분하면 순간의 변화가 내 손에!", "en": "Differentiate each component; instantaneous change is in my hands!", "formula": "r′(t) = (x′, y′, z′)"}, {"n": 22, "title": "벡터값 함수의 적분", "ko": "성분마다 차곡차곡 쌓아 누적 변위를 노래해!", "en": "Integrate each component and sing the accumulated displacement!", "formula": "∫r(t)dt = (∫xdt, ∫ydt, ∫zdt)"}, {"n": 23, "title": "공간곡선의 매개변수 표현", "ko": "하나의 매개변수로 삼차원 길을 그려 내지!", "en": "With a single parameter, I draw a winding path in three dimensions!", "formula": "r(t) = (cos t, sin t, t)"}, {"n": 24, "title": "속도벡터와 가속도벡터", "ko": "위치를 미분해 속도, 속도를 또 미분해 가속도!", "en": "Differentiate position for velocity, then velocity for acceleration!", "formula": "v = r′(t), a = r″(t)"}, {"n": 25, "title": "곡선의 호의 길이", "ko": "속력의 크기를 적분하면 구불구불한 길이 보여!", "en": "Integrate the magnitude of speed to measure a winding curve!", "formula": "L = ∫|r′(t)| dt"}, {"n": 26, "title": "단위접선벡터와 법선벡터", "ko": "접선은 앞으로, 법선은 굽는 쪽으로 안내해!", "en": "The tangent points ahead; the normal points toward the bend!", "formula": "T = r′/|r′|, N = T′/|T′|"}, {"n": 27, "title": "비틀림률과 프레네–세레 공식", "ko": "얼마나 굽고 비트는지, 세 벡터의 춤으로 밝혀!", "en": "How sharply I bend and twist! The Frenet–Serret frame reveals my dance!", "formula": "κ = |r′ × r″| / |r′|³"}, {"n": 28, "title": "다변수함수의 정의와 그래프", "ko": "입력이 둘 셋이어도 좋아, 표면 위 높이를 들려줘!", "en": "Two or three inputs? No problem; I sing the height of a surface!", "formula": "z = f(x,y)"}, {"n": 29, "title": "다변수함수의 극한과 연속", "ko": "어느 길로 다가가도 같은 값, 그때 극한이 나를 반겨!", "en": "Approach from every direction to the same value; then the limit greets me!", "formula": "lim₍ₓ,ᵧ₎→₍ₐ,ᵦ₎ f(x,y) = L"}, {"n": 30, "title": "편도함수의 정의와 계산", "ko": "다른 변수 잠깐 멈춰, 하나만 바꾸어 살펴봐!", "en": "Hold the other variables still and change just one at a time!", "formula": "fₓ = ∂f/∂x"}, {"n": 31, "title": "고계 편도함수와 혼합편도함수", "ko": "한 번 더 미분하고 순서도 바꿔, 조건 맞으면 결과 같아!", "en": "Differentiate again, switch the order; under the right conditions the results agree!", "formula": "fₓᵧ = ∂²f / ∂y∂x"}, {"n": 32, "title": "전미분과 선형근사", "ko": "작은 변화는 접평면으로, 가까운 값을 예측해!", "en": "For small changes, the tangent plane predicts nearby values!", "formula": "df = fₓdx + fᵧdy"}, {"n": 33, "title": "다변수 합성함수의 연쇄법칙", "ko": "변화가 여러 길로 흐르면, 경로별 곱을 더해 줘!", "en": "When change travels along many paths, add the products along each route!", "formula": "dz/dt = fₓx′ + fᵧy′"}, {"n": 34, "title": "음함수 미분법", "ko": "숨은 함수도 겁내지 마, 관계식을 따라 미분해!", "en": "Don't fear a hidden function; differentiate the relation itself!", "formula": "dy/dx = −Fₓ/Fᵧ"}, {"n": 35, "title": "방향도함수와 기울기벡터", "ko": "원하는 방향으로 한 걸음, 변화율은 내적에 숨어!", "en": "Take a step in any chosen direction; the rate of change hides in a dot product!", "formula": "Dᵤf = ∇f · u"}, {"n": 36, "title": "접평면과 법선벡터", "ko": "곡면을 살짝 확대하면 평면, 법선은 곧게 서 있지!", "en": "Zoom in on a smooth surface: a tangent plane appears, its normal standing tall!", "formula": "z−z₀ = fₓ(x−x₀)+fᵧ(y−y₀)"}, {"n": 37, "title": "헤세 행렬과 테일러 전개", "ko": "두 번째 변화까지 읽어, 곡면의 굴곡을 예언해!", "en": "Read second-order changes; the Hessian and Taylor series forecast the curvature!", "formula": "Hf = [fₓₓ fₓᵧ; fᵧₓ fᵧᵧ]"}, {"n": 38, "title": "임계점과 정류점", "ko": "기울기가 영이거나 미분 불가, 후보들을 먼저 불러!", "en": "Zero gradient or undefined derivative? Call the critical candidates forward!", "formula": "∇f = 0"}, {"n": 39, "title": "국소최댓값과 국소최솟값", "ko": "주변보다 높거나 낮아, 가까운 곳의 챔피언!", "en": "Higher or lower than my neighbors, I am the local champion!", "formula": "f(p) ≥ f(x) 또는 f(p) ≤ f(x)"}, {"n": 40, "title": "이계도함수 판정법", "ko": "오목 볼록 굽은 모양으로 극값의 표정을 읽어!", "en": "Read concavity and curvature to judge the nature of an extremum!", "formula": "D = fₓₓ fᵧᵧ − fₓᵧ²"}, {"n": 41, "title": "헤세 행렬과 극값 판정", "ko": "고유한 곡률의 조합으로 봉우리와 안장을 가려!", "en": "The Hessian's curvature signs distinguish peaks, valleys, and saddles!", "formula": "H ≻ 0 : 국소최솟값"}, {"n": 42, "title": "제약조건이 있는 최적화", "ko": "마음대로 못 가는 길, 조건 속 최고의 답을 찾아!", "en": "I cannot roam freely; find the best answer within constraints!", "formula": "max f(x) subject to g(x)=0"}, {"n": 43, "title": "라그랑주 승수법", "ko": "제약의 법선과 목적의 기울기, 평행한 순간을 잡아!", "en": "When objective and constraint gradients align, catch the multiplier's moment!", "formula": "∇f = λ∇g"}, {"n": 44, "title": "공학 응용", "ko": "재료는 아끼고 성능은 높여, 설계의 왕관을 써!", "en": "Save materials and boost performance; crown the finest design!", "formula": "min 비용, max 성능"}, {"n": 45, "title": "스칼라장과 벡터장", "ko": "온도는 숫자 들판, 바람은 화살표 들판!", "en": "Temperature is a field of numbers; wind is a field of arrows!", "formula": "f(x,y,z), F(x,y,z)"}, {"n": 46, "title": "벡터장의 시각화와 흐름선", "ko": "곳곳의 화살표를 따라, 보이지 않는 흐름을 그려!", "en": "Follow arrows everywhere to trace an invisible flow!", "formula": "dr/dt = F(r)"}, {"n": 47, "title": "나블라 연산자", "ko": "나는 나블라, 델의 지휘봉! 미분의 오케스트라를 열어!", "en": "I am nabla, the conductor's baton of the differential orchestra!", "formula": "∇ = (∂ₓ, ∂ᵧ, ∂ᵤ)"}, {"n": 48, "title": "기울기 Gradient", "ko": "나는 그래디언트, 가장 가파른 오르막을 가리켜!", "en": "I am the gradient, pointing toward the steepest ascent!", "formula": "∇f = (fₓ,fᵧ,fᵤ)"}, {"n": 49, "title": "발산 Divergence", "ko": "나는 발산, 나가는 흐름이 들어오는 흐름보다 큰지 말해!", "en": "I am divergence; I measure net outward flow at a point!", "formula": "∇·F = Pₓ + Qᵧ + Rᵤ"}, {"n": 50, "title": "회전 Curl", "ko": "나는 컬, 작은 물레방아의 회전축과 세기를 밝혀!", "en": "I am curl; I reveal the axis and strength of a tiny spinning wheel!", "formula": "∇×F = (Rᵧ−Qᵤ, Pᵤ−Rₓ, Qₓ−Pᵧ)"}, {"n": 51, "title": "라플라시안 Laplacian", "ko": "나는 라플라시안, 주변과의 굽음 차이를 읽어!", "en": "I am the Laplacian, reading the sum of second spatial changes!", "formula": "∇²f = fₓₓ + fᵧᵧ + fᵤᵤ"}, {"n": 52, "title": "회전의 항등식", "ko": "회전의 발산은 영, 기울기의 회전도 영! 매끈한 장의 약속!", "en": "The divergence of curl is zero; the curl of gradient is zero, for smooth fields!", "formula": "∇·(∇×F)=0, ∇×(∇f)=0"}, {"n": 53, "title": "보존벡터장과 퍼텐셜함수", "ko": "나는 보존장, 길보다 시작과 끝이 중요해!", "en": "I am a conservative field; endpoints matter more than the path!", "formula": "F = ∇φ"}, {"n": 54, "title": "직교곡선좌표계의 미분연산자", "ko": "원통과 구에서도 나블라가 노래해, 척도인자를 잊지 마!", "en": "Even in cylinders and spheres, nabla sings; remember the scale factors!", "formula": "∇f = Σ(1/hᵢ)(∂f/∂qᵢ)eᵢ"}, {"n": 55, "title": "이중적분의 정의", "ko": "작은 면적 조각을 모아 넓은 영역의 총합을 불러!", "en": "Gather tiny patches of area and sing the total over a region!", "formula": "∬ᴅ f(x,y)dA"}, {"n": 56, "title": "직사각형 영역의 이중적분", "ko": "네모난 무대 위에서 두 번 적분해 만나!", "en": "On a rectangular stage, integrate twice to find the answer!", "formula": "∫ₐᵇ∫𝒸ᵈ f(x,y)dy dx"}, {"n": 57, "title": "일반 영역의 이중적분", "ko": "휘어진 경계도 괜찮아, 적분 한계를 맞춰 줘!", "en": "Curved boundaries are welcome; choose your integration limits carefully!", "formula": "∫ₐᵇ∫g₁(x)ᵍ²⁽ˣ⁾ f dy dx"}, {"n": 58, "title": "극좌표에서의 이중적분", "ko": "원을 만나면 알과 세타, 면적요소엔 알을 곱해!", "en": "For circular regions use r and theta; remember the extra r in area!", "formula": "dA = r dr dθ"}, {"n": 59, "title": "삼중적분의 정의", "ko": "작은 부피들이 모여 공간 전체를 채워!", "en": "Little volumes join together and fill the whole space!", "formula": "∭ᵥ f dV"}, {"n": 60, "title": "원기둥좌표의 삼중적분", "ko": "원통 속 부피의 리듬, 알 디알 디세타 디제트!", "en": "The cylindrical rhythm of volume: r dr d-theta dz!", "formula": "dV = r dr dθ dz"}, {"n": 61, "title": "구면좌표의 삼중적분", "ko": "구면의 부피요소, 알 제곱 사인 파이를 잊지 마!", "en": "In spherical coordinates, remember rho squared times sine phi!", "formula": "dV = ρ² sin φ dρ dφ dθ"}, {"n": 62, "title": "변수변환과 야코비안 행렬식", "ko": "좌표 바뀌면 면적도 변해, 절댓값 야코비안이 열쇠!", "en": "Change coordinates and areas change too; the absolute Jacobian is the key!", "formula": "∬ f(x(u,v),y(u,v))|J|du dv"}, {"n": 63, "title": "무게중심과 관성모멘트", "ko": "밀도를 쌓아 질량, 균형과 회전의 비밀을 풀어!", "en": "Integrate density for mass, balance, and rotational inertia!", "formula": "M = ∭ρ dV"}, {"n": 64, "title": "선적분의 정의", "ko": "나는 선적분, 구불구불한 길을 따라 모아!", "en": "I am a line integral, collecting values along a winding path!", "formula": "∫ᴄ f ds"}, {"n": 65, "title": "스칼라함수의 선적분", "ko": "길 위의 온도나 밀도를, 길이만큼 차곡차곡!", "en": "Add temperature or density along a curve, weighted by arc length!", "formula": "∫ᴄ f ds = ∫ f(r(t))|r′(t)|dt"}, {"n": 66, "title": "벡터장의 선적분", "ko": "화살표와 발걸음 내적해, 길 따라 일한 양을 세어!", "en": "Dot the vector field with each step to measure work along a path!", "formula": "∫ᴄ F·dr = ∫ F(r(t))·r′(t)dt"}, {"n": 67, "title": "곡선을 따라 작용하는 힘의 일", "ko": "힘이 이동을 밀어 준 만큼, 일의 크기를 노래해!", "en": "Count the work a force performs as an object moves!", "formula": "W = ∫ᴄ F·dr"}, {"n": 68, "title": "경로독립성과 보존벡터장", "ko": "돌아가는 길이 달라도 시작과 끝 같으면 같아!", "en": "Different routes, same endpoints, same work in a conservative field!", "formula": "∫ᴄ F·dr = φ(B)−φ(A)"}, {"n": 69, "title": "퍼텐셜함수와 선적분의 기본정리", "ko": "복잡한 적분도 끝값 빼기 시작값, 단숨에 해결!", "en": "Subtract the starting potential from the ending potential—integral solved!", "formula": "∫ᴄ ∇φ·dr = φ(B)−φ(A)"}, {"n": 70, "title": "폐곡선 적분과 순환", "ko": "제자리로 한 바퀴 돌아, 흐름의 순환을 재어!", "en": "Travel a closed loop and measure the circulation of the flow!", "formula": "∮ᴄ F·dr"}, {"n": 71, "title": "그린 정리", "ko": "평면의 테두리 순환이 안쪽 회전의 합과 만나!", "en": "Green's theorem links circulation around a plane boundary to curl inside!", "formula": "∮ᴄ Pdx+Qdy = ∬ᴅ(Qₓ−Pᵧ)dA"}, {"n": 72, "title": "매개변수 곡면", "ko": "두 매개변수 손을 잡아 공간의 막을 펼쳐!", "en": "Two parameters join hands and spread a surface through space!", "formula": "r(u,v) = (x(u,v),y(u,v),z(u,v))"}, {"n": 73, "title": "곡면의 접벡터와 법선벡터", "ko": "두 접벡터 외적하면 수직의 깃발이 솟아!", "en": "Cross two tangent vectors and a perpendicular flag rises!", "formula": "n ∥ rᵤ × rᵥ"}, {"n": 74, "title": "곡면의 넓이", "ko": "작은 패치들의 크기를 적분해 넓이를 구해!", "en": "Integrate the sizes of tiny surface patches to find area!", "formula": "A = ∬|rᵤ × rᵥ|du dv"}, {"n": 75, "title": "스칼라함수의 면적분", "ko": "표면의 밀도를 더하면 얇은 막의 질량이 돼!", "en": "Integrate surface density to find the mass of a thin sheet!", "formula": "∬ₛ f dS"}, {"n": 76, "title": "벡터장의 면적분", "ko": "표면을 뚫고 지나가는 흐름을 세어!", "en": "Count the flow passing straight through a surface!", "formula": "∬ₛ F·n dS"}, {"n": 77, "title": "곡면의 방향과 법선방향", "ko": "어느 쪽이 앞면일까, 법선 방향을 먼저 정해!", "en": "Which side is front? Choose the normal orientation first!", "formula": "n = ±(rᵤ×rᵥ)/|rᵤ×rᵥ|"}, {"n": 78, "title": "유량 Flux의 계산", "ko": "바람이 그물망을 통과해, 수직 성분만 셀 거야!", "en": "Wind crosses a net; count only its normal component!", "formula": "Φ = ∬ₛ F·n dS"}, {"n": 79, "title": "닫힌 곡면의 면적분", "ko": "빈틈없이 감싼 껍질, 바깥 법선으로 총유출을 재!", "en": "A sealed surface measures total outward flux using outward normals!", "formula": "∯∂ᵥ F·n dS"}, {"n": 80, "title": "그린 정리의 증명과 응용", "ko": "테두리의 합과 내부의 회전, 평면에서 손잡아!", "en": "Boundary circulation and interior curl join hands across the plane!", "formula": "∮∂ᴅ Pdx+Qdy = ∬ᴅ(Qₓ−Pᵧ)dA"}, {"n": 81, "title": "가우스 발산정리", "ko": "껍질 밖으로 나간 총유량은 속의 발산 총합!", "en": "The total flux leaving a shell equals the total divergence inside!", "formula": "∯∂ᵥ F·n dS = ∭ᵥ ∇·F dV"}, {"n": 82, "title": "스토크스 정리", "ko": "경계의 순환은 표면 위 컬의 유량과 같아!", "en": "Circulation along the boundary equals flux of curl through the surface!", "formula": "∮∂ₛ F·dr = ∬ₛ(∇×F)·n dS"}, {"n": 83, "title": "스토크스의 관계", "ko": "경계와 내부를 잇는 다리, 차원을 넘어 함께 춤춰!", "en": "Green, Gauss, and Stokes bridge boundary and interior across dimensions!", "formula": "∫∂Ω ω = ∫Ω dω"}, {"n": 84, "title": "적분정리의 방향과 경계 조건", "ko": "법선과 진행방향 맞춰, 오른손 약속을 지켜!", "en": "Match the normal with boundary direction; follow the right-hand rule!", "formula": "n과 경계 진행 방향: 오른손 법칙"}, {"n": 85, "title": "미분형과 적분형의 변환", "ko": "한 점의 법칙을 온 영역으로, 적분하면 큰 그림!", "en": "From local laws to whole regions: integrate to see the bigger picture!", "formula": "미분형 ↔ 적분형"}, {"n": 86, "title": "벡터해석 기본정리의 종합 응용", "ko": "복잡한 계산도 정리 하나로, 길과 면과 부피를 연결!", "en": "One theorem simplifies complex work, linking paths, surfaces, and volumes!", "formula": "경계 적분 = 내부 미분의 적분"}, {"n": 87, "title": "벡터장과 상미분방정식", "ko": "변화율이 방향을 정하면, 궤적은 그 법칙을 따라!", "en": "When a vector field prescribes velocity, trajectories follow its law!", "formula": "r′(t) = F(r(t))"}, {"n": 88, "title": "벡터장의 흐름과 적분곡선", "ko": "화살표를 접선 삼아 입자의 길을 그려!", "en": "Use each arrow as a tangent to draw the path of a moving particle!", "formula": "dr/dt = F(r)"}, {"n": 89, "title": "연속방정식과 보존법칙", "ko": "들어오고 나간 양의 차이, 저장량의 변화를 말해!", "en": "Inflow minus outflow explains how stored quantity changes!", "formula": "∂ρ/∂t + ∇·(ρv)=0"}, {"n": 90, "title": "라플라스 방정식", "ko": "라플라시안 영인 조화함수, 평형의 고요를 지켜!", "en": "The Laplacian vanishes for harmonic functions in equilibrium!", "formula": "∇²u = 0"}, {"n": 91, "title": "푸아송 방정식", "ko": "원천이 있는 곳엔 라플라시안과 공급원이 만나!", "en": "Where sources exist, the Laplacian meets the source term!", "formula": "∇²u = f"}, {"n": 92, "title": "열방정식과 확산", "ko": "뜨거운 곳에서 차가운 곳으로, 열이 퍼지는 속도를 풀어!", "en": "From hot to cold, the heat equation describes spreading warmth!", "formula": "∂T/∂t = α∇²T"}, {"n": 93, "title": "파동방정식과 벡터해석", "ko": "시간의 두 번째 변화가 공간의 굽음과 손잡아!", "en": "Second change in time meets spatial curvature in the wave equation!", "formula": "∂²u/∂t² = c²∇²u"}, {"n": 94, "title": "중력장과 중력 퍼텐셜", "ko": "질량이 끌어당기는 힘, 퍼텐셜의 기울기로 읽어!", "en": "Mass attracts; read gravitational force from a potential gradient!", "formula": "g = −∇Φ"}, {"n": 95, "title": "전기장과 가우스 법칙", "ko": "전하가 만드는 전기장, 닫힌 면의 유량으로 밝혀!", "en": "Electric charge makes a field; closed-surface flux reveals Gauss's law!", "formula": "∯ E·n dS = Q/ε₀"}, {"n": 96, "title": "자기장과 앙페르 법칙", "ko": "전류가 돌리면 자기장이 감싸, 순환의 법칙을 노래해!", "en": "Currents are encircled by magnetic fields; sing Ampere's circulation law!", "formula": "∮ B·dr = μ₀I (정상 전류)"}, {"n": 97, "title": "패러데이 전자기유도 법칙", "ko": "자기선속이 바뀌면 전기장이 돌아, 유도의 노래!", "en": "When magnetic flux changes, electric fields circulate: induction sings!", "formula": "∮ E·dr = −dΦᴮ/dt"}, {"n": 98, "title": "맥스웰 방정식의 미분형과 적분형", "ko": "전기와 자기의 네 약속, 빛의 비밀을 이어 줘!", "en": "Four promises of electricity and magnetism reveal the secret of light!", "formula": "∇·E=ρ/ε₀, ∇·B=0"}, {"n": 99, "title": "와도", "ko": "물의 흐름, 퍼짐과 소용돌이까지 한눈에 읽어!", "en": "Read fluid flow, expansion, and swirling vorticity at a glance!", "formula": "ω = ∇×v"}, {"n": 100, "title": "벡터해석 종합 탐구 프로젝트", "ko": "드론과 바람, 전자기와 물결! 백 가지 지혜로 세상을 풀어!", "en": "Drones, winds, fields, and waves: solve the world with a hundred ideas!", "formula": "관측 → 모델 → 계산 → 검증"}];let idx=0,active=false;function render(){let x=items[idx];for(let k of ['title','ko','en'])document.getElementById(k).textContent=x[k];document.getElementById('math').textContent=x.formula;document.getElementById('counter').textContent=x.n+' / 100';}function stop(){active=false;speechSynthesis.cancel()}function voices(){return speechSynthesis.getVoices()}function speak(text,lang,gender,cb){let u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=+document.getElementById('rate').value;let a=voices().filter(v=>v.lang.toLowerCase().startsWith(lang.slice(0,2)));u.voice=a.find(v=>new RegExp(gender==='male'?'male|남성':'female|여성','i').test(v.name))||a[0]||null;u.onend=cb;u.onerror=()=>{active=false};speechSynthesis.speak(u)}function cycle(){if(!active)return;render();let x=items[idx];speak(x.ko,'ko-KR','male',()=>{if(!active)return;speak(x.en,'en-US','female',()=>{if(!active)return;if(idx<items.length-1){idx++;cycle()}else active=false})})}function play(){stop();active=true;cycle()}function next(){stop();idx=Math.min(idx+1,99);render()}function prev(){stop();idx=Math.max(idx-1,0);render()}render();</script></html>
