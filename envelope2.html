</style><style>.python-panel{margin-top:8px;background:#0d172b;border:1px solid #3b5777;border-radius:15px;padding:14px}.python-panel h2{font-size:18px;margin:0 0 8px}.python-panel pre{background:#071020;color:#baf9e8;white-space:pre;overflow:auto;padding:15px;border-radius:9px;font:14px/1.6 Consolas,monospace;max-height:340px}.python-actions{display:flex;gap:8px;flex-wrap:wrap}.python-actions button{font-size:13px}@media print{.python-panel pre{max-height:none;white-space:pre-wrap}}</style></head><body><header><h1>🎼 포락선의 노래 — 스무 곡선의 자기소개</h1><div class="sub">The Enchanted Envelope Parade · 20가지 수학 곡선의 순차 애니메이션</div></header><main><aside><div class="num" id="number">01 / 20</div><div class="name" id="name"></div><div class="en" id="english"></div><div class="lyrics" id="lyrics"></div><div class="note" id="note"></div></aside><section class="stage"><div class="canvasWrap"><canvas id="canvas"></canvas><div class="overlay" id="overlay">곡선을 그리는 중…</div></div><div class="progress" id="progress"></div><div class="controls"><button id="prev">◀ 이전</button><button class="primary" id="play">⏸ 일시정지</button><button id="next">다음 ▶</button><label>속도 <select id="speed"><option value="6">6초</option><option value="10" selected>10초</option><option value="15">15초</option><option value="20">20초</option><option value="30">30초</option></select></label><label><input type="checkbox" id="loop" checked> 반복</label><label><input type="checkbox" id="trace" checked> 그리기 과정</label></div><div class="hint">각 곡선은 선택한 시간 동안 차례로 그려집니다. 음악 파일을 추가하면 아래 플레이어에서 별도로 재생할 수 있습니다. 곡선 전환은 음원과 자동 동기화되지 않습니다.</div><div class="controls"><label>🎵 MP3/M4A 선택 <input type="file" id="music" accept="audio/*"></label><button id="sync">음악 처음부터</button></div><audio id="audio" class="audio" controls></audio><div id="list"></div><section class="python-panel"><h2>🐍 현재 곡선의 파이썬 코드</h2><p class="hint">NumPy · Matplotlib / IDLE에서 코드 전체를 복사해 실행하세요.</p><div class="python-actions"><button id="copyPython">현재 코드 복사</button><button id="downloadPython">현재 코드 .py 저장</button><button id="downloadAllPython">20개 코드 전체 .py 저장</button></div><pre id="pythonCode"></pre></section></section></main><script>
const C=[
['포물선','Parabola','나는 포물선, 활짝 열린 미소\n가운데 꼭짓점에서 양쪽으로 뻗죠\n한 축을 따라 거울처럼 대칭\n부드럽게 휘어지는 나를 보세요!','y = 0.13x². 대칭축과 꼭짓점이 있는 이차곡선.',t=>{let x=-4+8*t;return [x,.13*x*x-1.7]}],
['네프로드','Nephroid','나는 네프로드, 빛이 만든 무대\n둥근 그릇 안 반사광이 모여요\n두 뾰족점 품은 빛의 무늬\n반짝이는 카우스틱, 나를 불러요!','네프로드는 두 첨점을 갖는 6차 대수곡선이며 원의 반사 카우스틱으로 나타납니다.',t=>{let a=t*2*Math.PI;return [2.2*(3*Math.cos(a)-Math.cos(3*a))/4,2.2*(3*Math.sin(a)-Math.sin(3*a))/4]}],
['카디오이드','Cardioid','나는 카디오이드, 하트 같은 얼굴\n뾰족한 한 점에서 사랑이 피죠\n둥글게 한 바퀴 감싸 안으며\n심장처럼 두근두근 춤을 춰요!','극좌표 r = 1.25(1−cos θ), 첨점이 하나인 심장형 곡선.',t=>{let a=2*Math.PI*t,r=1.25*(1-Math.cos(a));return [r*Math.cos(a),r*Math.sin(a)]}],
['델토이드','Deltoid','나는 델토이드, 꼭짓점 셋!\n작은 원이 큰 원 안을 굴러가면\n세 갈래 뾰족한 별빛의 춤\n하나 둘 셋, 삼박자로 돌아요!','세 첨점 하이포사이클로이드.',t=>{let a=2*Math.PI*t;return [1.7*Math.cos(a)+.85*Math.cos(2*a),1.7*Math.sin(a)-.85*Math.sin(2*a)]}],
['아스트로이드','Astroid','나는 아스트로이드, 뾰족점 넷!\n위아래 양옆으로 반짝이는 별\n원 안에서 구르며 남긴 자취\n네 방향에 인사하는 곡선이에요!','x = a cos³t, y = a sin³t. 네 첨점 하이포사이클로이드.',t=>{let a=2*Math.PI*t;return [2.5*Math.cos(a)**3,2.5*Math.sin(a)**3]}],
['에피사이클로이드','Epicycloid','나는 에피사이클로이드, 바깥을 돌아\n큰 원의 둘레를 작은 원이 굴러\n원 위의 한 점이 그린 발자국\n톡톡 튀는 뾰족 무늬가 생겨요!','반지름 비 R/r = 3인 3첨점 에피사이클로이드.',t=>{let a=2*Math.PI*t;return [1.8*Math.cos(a)-.45*Math.cos(4*a),1.8*Math.sin(a)-.45*Math.sin(4*a)]}],
['하이포사이클로이드','Hypocycloid','나는 하이포사이클로이드, 안쪽을 돌아\n큰 원 속 작은 원이 데굴데굴\n원의 둘레 위 한 점을 따라\n안에서 피어나는 별을 그려요!','반지름 비 R/r = 5인 5첨점 하이포사이클로이드.',t=>{let a=2*Math.PI*t;return [2*Math.cos(a)+.5*Math.cos(4*a),2*Math.sin(a)-.5*Math.sin(4*a)]}],
['에피트로코이드','Epitrochoid','나는 에피트로코이드, 바깥의 여행자\n구르는 원에 붙은 점이 춤을 춰요\n그 점은 둘레에만 있진 않아요\n거리 따라 달라지는 꽃무늬죠!','원 둘레에서 떨어진 점이 만드는 바깥쪽 트로코이드.',t=>{let a=2*Math.PI*t;return [1.65*Math.cos(a)-.8*Math.cos(5*a),1.65*Math.sin(a)-.8*Math.sin(5*a)]}],
['하이포트로코이드','Hypotrochoid','나는 하이포트로코이드, 원 안의 화가\n작은 원 위 정해 둔 점이 돌아요\n빙글빙글 안쪽에서 그린 무늬\n스피로그래프 같은 꿈을 꾸어요!','큰 원 안에서 구르는 작은 원에 고정된 점의 자취.',t=>{let a=2*Math.PI*t;return [1.5*Math.cos(a)+1*Math.cos(4*a),1.5*Math.sin(a)-1*Math.sin(4*a)]}],
['원','Circle','나는 원, 중심에서 같은 거리\n어느 방향 보아도 둥근 미소\n접선은 반지름과 직각으로 만나\n끝도 없이 이어지는 둥근 노래!','x²+y²=r². 중심에서 같은 거리에 있는 점들의 집합.',t=>{let a=2*Math.PI*t;return [2.2*Math.cos(a),2.2*Math.sin(a)]}],
['타원','Ellipse','나는 타원, 두 초점을 품었죠\n두 초점까지 거리의 합은 같아요\n길게 늘인 둥근 무대 위에서\n우아하게 한 바퀴 돌아볼까요?','두 초점까지 거리 합이 일정한 곡선.',t=>{let a=2*Math.PI*t;return [2.8*Math.cos(a),1.55*Math.sin(a)]}],
['쌍곡선','Hyperbola','나는 쌍곡선, 두 갈래로 펼쳐져\n서로 멀어지는 날개를 가졌죠\n두 초점 거리 차의 절댓값은 일정\n점근선을 바라보며 뻗어가요!','x²/a²−y²/b²=1. 두 가지를 각각 그립니다.',t=>{let side=t<.5?1:-1,u=(t% .5)*2,v=-1.5+3*u;return [side*1.05*Math.cosh(v),1.05*Math.sinh(v)]}],
['사인곡선','Sine Wave','나는 사인곡선, 영에서 출발해\n위로 아래로 물결을 만들어요\n같은 리듬 되풀이하는 주기\n파도처럼 출렁출렁 노래해요!','y = 1.6 sin(2x), 주기 π.',t=>{let x=-3.1+6.2*t;return [x,1.6*Math.sin(2*x)]}],
['코사인곡선','Cosine Wave','나는 코사인곡선, 꼭대기서 시작해\n사인보다 사분의 일 주기 앞서요\n나란히 흐르는 두 물결의 춤\n위상이 달라도 우린 친구예요!','y = 1.6 cos(2x), 사인보다 위상이 π/2 앞섭니다.',t=>{let x=-3.1+6.2*t;return [x,1.6*Math.cos(2*x)]}],
['장미곡선','Rose Curve','나는 장미곡선, 꽃잎을 펼쳐요\n극좌표의 리듬이 꽃을 피우죠\n코사인에 각도를 곱해 주면\n하나하나 꽃잎이 춤을 춰요!','r = 2.4 cos(5θ). 홀수 5의 장미곡선은 꽃잎 5개.',t=>{let a=2*Math.PI*t,r=2.4*Math.cos(5*a);return [r*Math.cos(a),r*Math.sin(a)]}],
['리사주','Lissajous Curve','나는 리사주, 두 진동의 만남\n가로세로 다른 박자로 흔들려요\n진동수 비와 위상을 바꾸면\n매듭 같은 아름다운 무늬가 돼요!','x = 2.5 sin(3t+π/2), y = 2 sin(4t).',t=>{let a=2*Math.PI*t;return [2.5*Math.sin(3*a+Math.PI/2),2*Math.sin(4*a)]}],
['아르키메데스 나선','Archimedean Spiral','나는 나선, 중심에서 출발해\n한 바퀴 돌수록 일정하게 멀어져\n빙글빙글 펼쳐지는 길 위에\n같은 간격의 회전이 이어져요!','r = 0.12θ. 한 바퀴마다 반지름이 같은 양만큼 증가.',t=>{let a=6*Math.PI*t,r=.13*a;return [r*Math.cos(a),r*Math.sin(a)]}],
['로그나선','Logarithmic Spiral','나는 로그나선, 자라나는 소용돌이\n돌아갈수록 반지름이 비율로 커져\n어느 곳에서도 닮은 내 모습\n일정한 각도로 바람을 안아요!','r = 0.12e^(0.16θ). 회전할 때 반지름이 일정한 비율로 증가.',t=>{let a=6*Math.PI*t,r=.12*Math.exp(.16*a);return [r*Math.cos(a),r*Math.sin(a)]}],
['인벌류트','Involute of a Circle','나는 인벌류트, 실 끝의 여행\n둥근 원에 감긴 실을 팽팽히 풀면\n실 끝이 지나간 자취를 따라\n천천히 펼쳐지는 곡선이에요!','원에서 실을 풀 때 실 끝의 자취. x=a(cos t+t sin t), y=a(sin t−t cos t).',t=>{let a=9*t;return [.48*(Math.cos(a)+a*Math.sin(a)),.48*(Math.sin(a)-a*Math.cos(a))]}],
['베지에 곡선','Bézier Curve','나는 베지에, 조절점의 마법\n시작점과 끝점 사이를 잇죠\n가운데 조절점이 모양을 이끌어\n매끄러운 디자인을 완성해요!','3차 베지에: 네 조절점의 가중합으로 부드러운 곡선을 생성.',t=>{let p=[[-2.8,-1.7],[-2.1,2.8],[1.6,-2.8],[2.8,1.7]],u=1-t;return [0,1].map(k=>u**3*p[0][k]+3*u*u*t*p[1][k]+3*u*t*t*p[2][k]+t**3*p[3][k])}]
];
