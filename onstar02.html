let ready=new Array(10).fill(false), submitted=false;
function decode(s){const bytes=Uint8Array.from(atob(s),c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(bytes)}
function init(){const menu=document.getElementById('menu'),panels=document.getElementById('panels');embedded.forEach((b,i)=>{let btn=document.createElement('button');btn.textContent=`Sector ${String(i+1).padStart(2,'0')} · ${titles[i]}`;btn.onclick=()=>show(i);btn.id='tab'+i;menu.append(btn);let panel=document.createElement('section');panel.className='panel';panel.id='panel'+i;let frame=document.createElement('iframe');frame.id='frame'+i;frame.title=`Sector ${i+1} ${titles[i]}`;frame.onload=()=>{ready[i]=true;document.getElementById('status').textContent=`문항 로딩: ${ready.filter(Boolean).length}/10 Sector`};frame.srcdoc=decode(b);panel.append(frame);panels.append(panel)});show(0)}
function show(i){document.querySelectorAll('.panel').forEach((e,j)=>e.classList.toggle('active',i===j));document.querySelectorAll('#menu button').forEach((e,j)=>e.classList.toggle('active',i===j));document.getElementById('current').textContent=`Sector ${String(i+1).padStart(2,'0')} · ${titles[i]} · 5문항 · 문항당 ${weights[i]}점`;window.scrollTo({top:0,behavior:'instant'})}
function evaluate(win,expr){return win.eval(expr)}
function keyFor(i,w,k){const ex=[
`data[${k}].map((o,j)=>o.ok?j:-1).filter(x=>x>=0)`,
`DATA[${k}].opts.map((o,j)=>o.ok?j:-1).filter(x=>x>=0)`,
`DATA[${k}].options.map((o,j)=>o.correct?j:-1).filter(x=>x>=0)`,
`answers[${k}]`,
`questions[${k}].correct`,
`DATA[${k}].correct`,
`data[${k}].answers`,
`data[${k}].ans`,
`answers[${k}]`,
`answers[${k}]`];return Array.from(evaluate(w,ex[i])).map(Number).sort((a,b)=>a-b)}
function detailed(i,w,k,doc){try{const ex=[
`data[${k}].map((o,j)=>['①','②','③','④','⑤'][j]+' '+(o.ok?'옳음':'틀림')+' — '+o.detail).join('\n')`,
`DATA[${k}].opts.map((o,j)=>['①','②','③','④','⑤'][j]+' '+(o.ok?'옳음':'틀림')+' — '+o.why).join('\n')`,
`DATA[${k}].options.map((o,j)=>['①','②','③','④','⑤'][j]+' '+(o.correct?'옳음':'틀림')+' — '+o.explanation).join('\n')`,
`document.getElementById('d${k}').textContent`,
`questions[${k}].explanations.map((x,j)=>['①','②','③','④','⑤'][j]+' '+x).join('\n')`,
`DATA[${k}].explanations.map((x,j)=>['①','②','③','④','⑤'][j]+' '+x).join('\n')`,
`data[${k}].explain+'\n'+data[${k}].options.map((x,j)=>['①','②','③','④','⑤'][j]+' '+x).join('\n')`,
`data[${k}].expl.map((x,j)=>['①','②','③','④','⑤'][j]+' '+x).join('\n')`,
`document.getElementById('d${k+1}').textContent`,
`'첫 재귀 호출은 현재 원소를 제외하고, 두 번째 호출은 포함합니다. 모든 원소에 대해 두 갈래로 분기하므로 n개 원소에서 총 2^n번 출력합니다. 선택 결과는 새 리스트로 전달되며 중복 원소가 있다면 같은 내용이 여러 번 출력될 수 있습니다.'`
];const s=evaluate(w,ex[i]);return String(s||'').replaceAll('\n','\n')}catch(e){return '원본 문항의 해설을 불러오지 못했습니다: '+e.message}}
function questionText(i,doc,k){let q=doc.querySelectorAll('input[type=checkbox][name="q'+(i===8?k+1:k)+'"]');if(!q.length)return '';const a=q[0];let section=a.closest('section')||a.closest('article')||a.closest('.card')||a.parentElement;let code=section.querySelector('pre,code');return code?code.textContent.trim():''}
function optionTexts(i,doc,k){let inputs=[...doc.querySelectorAll('input[type=checkbox][name="q'+(i===8?k+1:k)+'"]')];return inputs.map(x=>(x.closest('label')?.textContent||'').trim())}
function exportReport(){const id=document.getElementById('studentId').value.trim(),name=document.getElementById('studentName').value.trim();if(!id||!name){alert('학번과 이름을 입력하세요.');return}if(!ready.every(Boolean)){alert('10개 Sector의 로딩이 끝난 후 다시 시도하세요.');return}
let missing=[];for(let i=0;i<10;i++){const doc=document.getElementById('frame'+i).contentDocument;for(let k=0;k<5;k++){let q=doc.querySelectorAll('input[type=checkbox][name="q'+(i===8?k+1:k)+'"]:checked');if(q.length!==2)missing.push(`Sector ${i+1} 문항 ${k+1}`)}}if(missing.length&&!confirm(`${missing.length}개 문항에서 2개를 선택하지 않았습니다. 미응답은 0점으로 처리하고 결과를 저장할까요?`))return;
let now=new Date(),stamp=[now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('')+'_'+[now.getHours(),now.getMinutes(),now.getSeconds()].map(x=>String(x).padStart(2,'0')).join('');let lines=['정보과학2 · 통합 평가 결과','10개 Sector / 총 50문항 / 각 문항 옳은 것 2개 고르기',`학번: ${id}`,`이름: ${name}`,`응시시각: ${now.toLocaleString('ko-KR')}`,''];let total=0,correct=0,per=[];
for(let i=0;i<10;i++){let frame=document.getElementById('frame'+i),doc=frame.contentDocument,w=frame.contentWindow,part=0;lines.push('='.repeat(66),`Sector ${String(i+1).padStart(2,'0')} · ${titles[i]} (각 ${weights[i]}점)`,'='.repeat(66));for(let k=0;k<5;k++){let chosen=[...doc.querySelectorAll('input[type=checkbox][name="q'+(i===8?k+1:k)+'"]:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b);let key=keyFor(i,w,k);let ok=chosen.length===2&&JSON.stringify(chosen)===JSON.stringify(key);let score=ok?weights[i]:0;part+=score;if(ok)correct++;let opts=optionTexts(i,doc,k);lines.push('',`[문항 ${String(k+1).padStart(2,'0')}] ${ok?'정답':'오답'} | ${score.toFixed(1)} / ${weights[i].toFixed(1)}점`,`학생 선택: ${chosen.length?chosen.map(x=>marks[x]).join(', '):'미응답'}`,`모범 정답: ${key.map(x=>marks[x]).join(', ')}`);let code=questionText(i,doc,k);if(code)lines.push('제시된 파이썬 코드:',code);if(opts.length)lines.push('보기:',...opts);lines.push('상세 해설:',detailed(i,w,k,doc));}total+=part;per.push(part);lines.push('',`Sector ${i+1} 소계: ${part.toFixed(1)} / ${(weights[i]*5).toFixed(1)}점`)}let max=weights.reduce((a,b)=>a+b*5,0),converted=Math.round(total/max*10000)/100;lines.splice(6,0,`원점수: ${total.toFixed(1)} / ${max.toFixed(1)}점`,`100점 환산: ${converted.toFixed(2)}점`,`정답 문항: ${correct}/50`,'');let safe=s=>s.replace(/[\\/:*?"<>|\s]+/g,'_');let filename=`${safe(id)}_${safe(name)}_${converted.toFixed(2)}_정보과학2_${stamp}.txt`;let blob=new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/plain;charset=utf-8'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);document.getElementById('result').textContent=`채점 완료: ${correct}/50문항 정답 · 원점수 ${total.toFixed(1)}/${max.toFixed(1)} · 환산 ${converted.toFixed(2)}/100점 · TXT 저장`;submitted=true}
window.addEventListener('DOMContentLoaded',init);
</script></body></html>
