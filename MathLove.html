let page=0,idx=-1,reading=false,paused=false,allMode=false,session=0;const $=id=>document.getElementById(id);
function render(){const p=pages[page];$('section').textContent=p.title;$('counter').textContent=`${page+1} / ${pages.length}`;$('fill').style.width=`${100*(page+1)/pages.length}%`;$('lines').innerHTML='';p.pairs.forEach((v,i)=>{const d=document.createElement('div');d.className='pair';d.dataset.index=i;const k=document.createElement('div'),e=document.createElement('div');k.className='ko';e.className='en';k.textContent=v.ko;e.textContent=v.en;d.append(k,e);d.onclick=()=>{stop();idx=i;highlight();speakPair(i,session)};$('lines').append(d)});highlight()}
function highlight(){document.querySelectorAll('.pair').forEach((x,i)=>x.classList.toggle('active',i===idx))}
function stop(){session++;reading=false;paused=false;allMode=false;idx=-1;speechSynthesis.cancel();$('read').textContent='▶ 한영 교차 읽기';$('pause').textContent='⏸ 일시정지';highlight();restoreMusic()}
function move(delta){stop();page=Math.min(pages.length-1,Math.max(0,page+delta));render()}
function voices(){let list=speechSynthesis.getVoices();for(const [id,lang] of [['voiceKo','ko'],['voiceEn','en']]){const sel=$(id),old=sel.value;sel.innerHTML='';const found=list.filter(v=>v.lang.toLowerCase().startsWith(lang));for(const v of found){const o=document.createElement('option');o.value=v.voiceURI;o.textContent=`${v.name} (${v.lang})`;sel.append(o)}if([...sel.options].some(o=>o.value===old))sel.value=old;else{let female=found.find(v=>/female|heami|yuna|sunhi|zira|jenny|aria|samantha|soyoung|sora/i.test(v.name));if(female)sel.value=female.voiceURI}}}
function voiceFor(lang){return speechSynthesis.getVoices().find(v=>v.voiceURI===$(lang==='ko'?'voiceKo':'voiceEn').value)}
function restoreMusic(){if($('player').src)$('player').volume=1}
function say(text,lang,token){return new Promise(resolve=>{if(token!==session)return resolve(false);let u=new SpeechSynthesisUtterance(text);u.lang=lang==='ko'?'ko-KR':'en-US';u.rate=Number($('rate').value);const v=voiceFor(lang);if(v)u.voice=v;let done=false;const finish=ok=>{if(!done){done=true;resolve(ok)}};u.onend=()=>finish(true);u.onerror=()=>finish(false);speechSynthesis.speak(u)})}
async function speakPair(i,token){if(token!==session)return;reading=true;idx=i;highlight();if($('duck').checked&&$('player').src)$('player').volume=.16;const pair=pages[page].pairs[i];let ok=await say(pair.ko,'ko',token);if(!ok||token!==session)return;ok=await say(pair.en,'en',token);if(!ok||token!==session)return;if(i+1<pages[page].pairs.length){return speakPair(i+1,token)}if($('autoNext').checked&&page+1<pages.length){page++;idx=-1;render();return speakPair(0,token)}reading=false;restoreMusic();$('read').textContent='▶ 한영 교차 읽기'}
function start(fromBeginning=false){stop();if(fromBeginning){page=0;render()}const token=session;reading=true;$('read').textContent='↻ 다시 읽기';speakPair(0,token)}
$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);$('read').onclick=()=>start();$('all').onclick=()=>start(true);$('stop').onclick=stop;$('pause').onclick=()=>{if(!reading)return;if(!paused){speechSynthesis.pause();paused=true;$('pause').textContent='▶ 계속'}else{speechSynthesis.resume();paused=false;$('pause').textContent='⏸ 일시정지'}};$('rate').oninput=()=>{$('rateText').textContent=Number($('rate').value).toFixed(2)+'×'};$('music').onchange=e=>{const f=e.target.files[0];if(f){$('player').src=URL.createObjectURL(f);$('player').play().catch(()=>{})}};document.addEventListener('keydown',e=>{if(['INPUT','SELECT','BUTTON'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);if(e.code==='Space'){e.preventDefault();if(reading)$('pause').click();else start()}});speechSynthesis.onvoiceschanged=voices;voices();render();
</script></body></html>
