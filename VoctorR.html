<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>벡터해석 100개 개념 백과사전</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts (Inter & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- MathJax for rendering LaTeX formulas -->
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'global'
      }
    };
  </script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: 'Inter', 'Noto Sans KR', sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.5);
      border-radius: 3px;
    }
    .dark .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.05);
    }
    .dark .custom-scrollbar::-webkit-scrollbar-thumb {
      background: rgba(75, 85, 99, 0.5);
    }
  </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-800 dark:text-slate-100 h-full flex flex-col transition-colors duration-200">

  <!-- Top Header Navigation -->
  <header class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 shadow-sm transition-colors">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <button id="toggle-sidebar-mobile" class="md:hidden p-2 rounded-lg text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700">
          <i class="fa-solid fa-bars text-xl"></i>
        </button>
        <div class="flex items-center space-x-2">
          <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
            $\vec{V}$
          </div>
          <div>
            <h1 class="text-lg font-bold leading-tight text-slate-900 dark:text-white">벡터해석 백과사전</h1>
            <p class="text-xs text-indigo-600 dark:text-indigo-400 font-medium">100 Concepts Vector Calculus Master System</p>
          </div>
        </div>
      </div>

      <!-- Search & Quick Stats -->
      <div class="flex items-center space-x-4">
        <div class="hidden sm:flex items-center space-x-2 bg-slate-100 dark:bg-slate-700/60 px-3 py-1.5 rounded-full text-xs font-semibold text-slate-600 dark:text-slate-300">
          <i class="fa-solid fa-square-check text-emerald-500"></i>
          <span>완료: <span id="completed-count" class="text-indigo-600 dark:text-indigo-400 font-bold">0</span> / 100</span>
        </div>
        
        <button id="theme-toggle" class="p-2 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors">
          <i class="fa-solid fa-moon dark:hidden text-lg"></i>
          <i class="fa-solid fa-sun hidden dark:block text-lg text-amber-400"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Workspace Container -->
  <div class="flex-1 flex overflow-hidden max-w-7xl w-full mx-auto">

    <!-- Left Navigation Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-80 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out md:static md:z-auto flex flex-col h-[calc(100vh-4rem)]">
      
      <!-- Search Input Box -->
      <div class="p-4 border-b border-slate-200 dark:border-slate-700 space-y-3">
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
          <input type="text" id="search-input" placeholder="개념 검색 (예: 외적, 그린 정리, 42)..." class="w-full pl-9 pr-8 py-2 bg-slate-100 dark:bg-slate-700 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-slate-800 dark:text-slate-100 placeholder-slate-400">
          <button id="clear-search" class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
            <i class="fa-solid fa-circle-xmark text-sm"></i>
          </button>
        </div>

        <!-- Filter buttons -->
        <div class="flex items-center justify-between text-xs font-medium">
          <button id="filter-all" class="px-2.5 py-1 rounded-md bg-indigo-50 dark:bg-indigo-900/40 text-indigo-600 dark:text-indigo-400 font-semibold">전체 (100)</button>
          <button id="filter-completed" class="px-2.5 py-1 rounded-md text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700">완료됨</button>
          <button id="filter-bookmarked" class="px-2.5 py-1 rounded-md text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700"><i class="fa-solid fa-bookmark text-amber-500 mr-1"></i>북마크</button>
        </div>
      </div>

      <!-- Chapter Tree List -->
      <div id="chapter-tree" class="flex-1 overflow-y-auto custom-scrollbar p-3 space-y-2">
        <!-- Chapter accordion dynamically rendered via JS -->
      </div>
    </aside>

    <!-- Overlay for mobile drawer -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/50 z-30 hidden md:hidden"></div>

    <!-- Right Main Content Viewer -->
    <main class="flex-1 overflow-y-auto custom-scrollbar bg-slate-50 dark:bg-slate-900 p-4 sm:p-6 md:p-8">
      
      <!-- Quick Dashboard Summary Banner -->
      <div class="mb-6 p-5 bg-gradient-to-r from-indigo-600 to-violet-600 rounded-2xl text-white shadow-xl shadow-indigo-500/10 flex flex-col md:flex-row items-center justify-between gap-4">
        <div>
          <span class="inline-block px-3 py-1 bg-white/20 rounded-full text-xs font-semibold backdrop-blur-md mb-2">벡터해석학 완전정복</span>
          <h2 class="text-xl sm:text-2xl font-extrabold tracking-tight">100개의 핵심 개념과 체계적 해설</h2>
          <p class="text-indigo-100 text-xs sm:text-sm mt-1 max-w-xl">기초 스칼라·벡터부터 Stokes 정리, Maxwell 방정식, 유체역학 응용까지 대화형 도해 및 심화 예제 제공.</p>
        </div>
        <div class="w-full md:w-auto flex items-center justify-center space-x-3 bg-white/10 p-3 rounded-xl backdrop-blur-md">
          <div class="text-center px-2">
            <span class="block text-2xl font-bold" id="progress-percent">0%</span>
            <span class="text-[10px] text-indigo-200">학습 진행률</span>
          </div>
          <div class="w-px h-8 bg-white/20"></div>
          <button id="btn-reset-progress" class="px-3 py-2 bg-white/20 hover:bg-white/30 rounded-lg text-xs font-medium transition-colors">
            <i class="fa-solid fa-rotate-left mr-1"></i> 초기화
          </button>
        </div>
      </div>

      <!-- Detail Card View Container -->
      <div id="concept-view-container" class="space-y-6">
        <!-- Dynamically rendered active concept card -->
      </div>

    </main>
  </div>

  <script>
    // -------------------------------------------------------------
    // DATA STRUCTURE FOR ALL 100 VECTOR CALCULUS CONCEPTS
    // -------------------------------------------------------------
    const CHAPTERS = [
      { id: 1, title: "제1단원. 벡터의 기초", range: [1, 10] },
      { id: 2, title: "제2단원. 공간기하와 좌표계", range: [11, 18] },
      { id: 3, title: "제3단원. 벡터값 함수와 공간곡선", range: [19, 27] },
      { id: 4, title: "제4단원. 다변수함수와 편미분", range: [28, 37] },
      { id: 5, title: "제5단원. 다변수함수의 최적화", range: [38, 44] },
      { id: 6, title: "제6단원. 벡터장과 미분연산자", range: [45, 54] },
      { id: 7, title: "제7단원. 다중적분", range: [55, 63] },
      { id: 8, title: "제8단원. 선적분", range: [64, 71] },
      { id: 9, title: "제9단원. 곡면과 면적분", range: [72, 79] },
      { id: 10, title: "제10단원. 벡터해석의 핵심 적분정리", range: [80, 86] },
      { id: 11, title: "제11단원. 벡터해석과 미분방정식", range: [87, 93] },
      { id: 12, title: "제12단원. 벡터해석의 실생활·과학 응용", range: [94, 100] }
    ];

    // Dedicated Custom SVG Diagram Generator for ALL 100 Concepts (100% Unique Diagrams)
    function generateConceptSVG(id, title) {
      const W = 320, H = 160;
      let svgContent = '';

      switch(id) {
        // 제1단원. 벡터의 기초 (1~10)
        case 1: // 1. 스칼라와 벡터의 개념
          svgContent = `
            <circle cx="70" cy="80" r="24" fill="#3b82f6" opacity="0.25"/>
            <circle cx="70" cy="80" r="5" fill="#3b82f6"/>
            <text x="70" y="125" text-anchor="middle" fill="#93c5fd" font-size="11" font-weight="bold">스칼라 (크기만 존재)</text>
            <defs><marker id="a1" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ec4899"/></marker></defs>
            <line x1="170" y1="100" x2="270" y2="40" stroke="#ec4899" stroke-width="4" marker-end="url(#a1)"/>
            <circle cx="170" cy="100" r="4" fill="#f43f5e"/>
            <text x="220" y="125" text-anchor="middle" fill="#f472b6" font-size="11" font-weight="bold">벡터 (크기 + 방향)</text>`;
          break;
        case 2: // 2. 벡터의 크기와 방향
          svgContent = `
            <line x1="40" y1="130" x2="280" y2="130" stroke="#475569" stroke-dasharray="3,3"/>
            <defs><marker id="a2" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6366f1"/></marker></defs>
            <line x1="40" y1="130" x2="220" y2="40" stroke="#6366f1" stroke-width="4" marker-end="url(#a2)"/>
            <path d="M 80 130 A 40 40 0 0 0 71 115" fill="none" stroke="#f59e0b" stroke-width="2"/>
            <text x="90" y="120" fill="#f59e0b" font-size="11">방향角 $\\theta$</text>
            <text x="120" y="75" fill="#818cf8" font-size="12" font-weight="bold">크기 $|\\vec{v}| = \\sqrt{x^2+y^2}$</text>`;
          break;
        case 3: // 3. 벡터의 덧셈과 뺄셈
          svgContent = `
            <defs><marker id="a3a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="a3b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a855f7"/></marker><marker id="a3c" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a3d" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker></defs>
            <line x1="40" y1="120" x2="140" y2="120" stroke="#38bdf8" stroke-width="3" marker-end="url(#a3a)"/>
            <line x1="140" y1="120" x2="220" y2="40" stroke="#a855f7" stroke-width="3" marker-end="url(#a3b)"/>
            <line x1="40" y1="120" x2="220" y2="40" stroke="#10b981" stroke-width="3" marker-end="url(#a3c)"/>
            <line x1="140" y1="120" x2="60" y2="40" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#a3d)"/>
            <text x="90" y="138" fill="#38bdf8" font-size="11">$\\vec{a}$</text>
            <text x="190" y="85" fill="#a855f7" font-size="11">$\\vec{b}$</text>
            <text x="110" y="70" fill="#10b981" font-size="11" font-weight="bold">합 $\\vec{a}+\\vec{b}$</text>
            <text x="70" y="65" fill="#f43f5e" font-size="10">차 $\\vec{a}-\\vec{b}$</text>`;
          break;
        case 4: // 4. 벡터의 실수배와 선형결합
          svgContent = `
            <defs><marker id="a4a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#38bdf8"/></marker><marker id="a4b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f59e0b"/></marker></defs>
            <line x1="30" y1="120" x2="100" y2="90" stroke="#38bdf8" stroke-width="3" marker-end="url(#a4a)"/>
            <line x1="30" y1="120" x2="240" y2="30" stroke="#f59e0b" stroke-width="3" marker-end="url(#a4b)"/>
            <text x="60" y="115" fill="#38bdf8" font-size="11">$\\vec{v}$</text>
            <text x="160" y="60" fill="#f59e0b" font-size="12" font-weight="bold">실수배 $c\\vec{v} \\,(c=3)$</text>`;
          break;
        case 5: // 5. 위치벡터와 단위벡터
          svgContent = `
            <line x1="40" y1="130" x2="280" y2="130" stroke="#475569"/>
            <line x1="40" y1="130" x2="40" y2="20" stroke="#475569"/>
            <defs><marker id="a5a" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#10b981"/></marker><marker id="a5b" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ef4444"/></marker></defs>
            <line x1="40" y1="130" x2="220" y2="40" stroke="#10b981" stroke-width="3" marker-end="url(#a5a)"/>
            <line x1="40" y1="130" x2="80" y2="110" stroke="#ef4444" stroke-width="4" marker-end="url(#a5b)"/>
            <circle cx="220" cy="40" r="4" fill="#10b981"/>
            <text x="225" y="35" fill="#10b981" font-size="11" font-weight="bold">위치 P(x,y,z)</text>
            <text x="75" y="98" fill="#ef4444" font-size="11" font-weight="bold">단위벡터 $\\hat{u} = \\frac{\\vec{r}}{|\\vec{r}|}$</text>`;
          break;
        case 6: // 6. 벡터의 성분과 좌표 표현
          svgContent = `
            <line x1="40" y1="130" x2="260" y2="130" stroke="#475569"/>
            <line x1="40" y1="130" x2="40" y2="30" stroke="#475569"/>
            <rect x="40" y="50" width="180" height="80" fill="rgba(99,102,241,0.1)" stroke="#818cf8" stroke-dasharray="4,4"/>
            <line x1="40" y1="130" x2="220" y2="50" stroke="#6366f1" stroke-width="3"/>
            <text x="130" y="145" fill="#38bdf8" font-size="11">x성분 $v_x \\hat{i}$</text>
            <text x="10" y="90" fill="#ec4899" font-size="11">y성분 $v_y \\hat{j}$</text>
            <text x="225" y="45" fill="#a855f7" font-size="11" font-weight="bold">$\\vec{v} = (v_x, v_y)$</text>`;
          break;
        case 7: // 7. 벡터의 내적과 기하학적 의미
          svgContent = `
            <line x1="50" y1="120" x2="250" y2="120" stroke="#38bdf8" stroke-width="3"/>
            <line x1="50" y1="120" x2="170" y2="40" stroke="#a855f7" stroke-width="3"/>
            <line x1="170" y1="40" x2="170" y2="120" stroke="#f43f5e" stroke-dasharray="3,3" stroke-width="2"/>
            <path d="M 80 120 A 30 30 0 0 0 71 106" fill="none" stroke="#f59e0b" stroke-width="2"/>
            <text x="85" y="112" fill="#f59e0b" font-size="10">$\\theta$</text>
            <text x="100" y="140" fill="#f43f5e" font-size="11" font-weight="bold">내적 $\\vec{a} \\cdot \\vec{b} = |\\vec{a}||\\vec{b}|\\cos\\theta$</text>`;
          break;
        case 8: // 8. 벡터의 외적과 기하학적 의미
          svgContent = `
            <polygon points="60,110 180,110 230,70 110,70" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-dasharray="3,3"/>
            <line x1="60" y1="110" x2="180" y2="110" stroke="#38bdf8" stroke-width="3"/>
            <line x1="60" y1="110" x2="110" y2="70" stroke="#a855f7" stroke-width="3"/>
            <defs><marker id="a8" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#f43f5e"/></marker></defs>
            <line x1="60" y1="110" x2="60" y2="25" stroke="#f43f5e" stroke-width="3" marker-end="url(#a8)"/>
            <text x="50" y="20" fill="#f43f5e" font-size="11" font-weight="bold">외적 $\\vec{a} \\times \\vec{b}$ (수직)</text>
            <text x="130" y="90" fill="#10b981" font-size="11">면적 = $|\\vec{a} \\times \\vec{b}|$</text>`;
          break;
        case 9: // 9. 스칼라 삼중곱과 벡터 삼중곱
          svgContent = `
            <polygon points="50,130 140,130 180,100 90,100" fill="rgba(59,130,246,0.3)" stroke="#3b82f6"/>
            <polygon points="50,130 140,130 140,70 50,70" fill="rgba(59,130,246,0.15)" stroke="#3b82f6"/>
            <polygon points="140,130 180,100 180,40 140,70" fill="rgba(59,130,246,0.2)" stroke="#3b82f6"/>
            <polygon points="50,70 140,70 180,40 90,40" fill="rgba(59,130,246,0.35)" stroke="#3b82f6"/>
            <line x1="50" y1="130" x2="50" y2="70" stroke="#ef4444" stroke-width="3"/>
            <text x="110" y="85" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">평행육면체 부피 $V = |\\vec{a} \\cdot (\\vec{b} \\times \\vec{c})|$</text>`;
          break;
        case 10: // 10. 벡터의 정사영과 직교분해
          svgContent = `
            <line x1="30" y1="130" x2="270" y2="130" stroke="#64748b" stroke-width="2"/>
            <line x1="50" y1="130" x2="190" y2="40" stroke="#a855f7" stroke-width="3"/>
            <line x1="190" y1="40" x2="190" y2="130" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
            <line x1="50" y1="130" x2="190" y2="130" stroke="#10b981" stroke-width="4"/>
            <text x="110" y="145" fill="#10b981" font-size="11" font-weight="bold">정사영 Proj (평행 성분)</text>
            <text x="200" y="85" fill="#ef4444" font-size="11" font-weight="bold">직교 성분 Orth</text>`;
          break;

        // 제2단원. 공간기하와 좌표계 (11~18)
        case 11: // 11. 3차원 직교좌표계
          svgContent = `
            <line x1="160" y1="140" x2="160" y2="20" stroke="#ef4444" stroke-width="2"/>
            <line x1="160" y1="140" x2="280" y2="140" stroke="#22c55e" stroke-width="2"/>
            <line x1="160" y1="140" x2="60" y2="170" stroke="#3b82f6" stroke-width="2"/>
            <circle cx="200" cy="70" r="5" fill="#f59e0b"/>
            <line x1="200" y1="70" x2="200" y2="140" stroke="#f59e0b" stroke-dasharray="3,3"/>
            <line x1="200" y1="140" x2="160" y2="140" stroke="#f59e0b" stroke-dasharray="3,3"/>
            <text x="208" y="65" fill="#f59e0b" font-size="11" font-weight="bold">P(x, y, z)</text>
            <text x="165" y="25" fill="#ef4444" font-size="10">Z</text><text x="275" y="135" fill="#22c55e" font-size="10">Y</text><text x="50" y="165" fill="#3b82f6" font-size="10">X</text>`;
          break;

    // Render Detailed Main Concept Card View with Solution Toggle Buttons
    function renderConceptView() {
      const container = document.getElementById('concept-view-container');
      const concept = CONCEPTS_DB.find(c => c.id === activeConceptId);
      if (!concept) return;

      const isCompleted = completedSet.has(concept.id);
      const isBookmarked = bookmarkedSet.has(concept.id);

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-700/80 transition-all">
          
          <!-- Concept Header & Actions -->
          <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-100 dark:border-slate-700/60">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">개념 ${concept.id} / 100</span>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-1">${concept.title}</h2>
            </div>

            <div class="flex items-center space-x-3">
              <button onclick="toggleBookmark(${concept.id})" class="px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition-colors ${
                isBookmarked 
                  ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300' 
                  : 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300 hover:bg-slate-200'

    $$\\oint_C \\vec{F} \\cdot d\\vec{r} = \\iint_S (\\nabla \\times \\vec{F}) \\cdot d\\vec{S}$$`;
    CONCEPTS_DB[81].applied = {
      q: "패러데이 전자기유도 법칙 적분형 $\\oint_C \\vec{E} \\cdot d\\vec{r} = -\\frac{d}{dt} \\iint_S \\vec{B} \\cdot d\\vec{S}$에 스토크스 정리를 적용하여 미분형을 도출하시오.",
      a: "풀이: 좌변에 스토크스 정리를 적용하면 $\\iint_S (\\nabla \\times \\vec{E}) \\cdot d\\vec{S} = \\iint_S \\left(-\\frac{\\partial \\vec{B}}{\\partial t}\\right) \\cdot d\\vec{S}$. 따라서 미분형 $\\nabla \\times \\vec{E} = -\\frac{\\partial \\vec{B}}{\\partial t}$를 얻습니다."
    };

    // -------------------------------------------------------------
    // STATE MANAGEMENT & LOCAL STORAGE
    // -------------------------------------------------------------
    let activeConceptId = 1;
    let completedSet = new Set(JSON.parse(localStorage.getItem('vcalc_completed') || '[]'));
    let bookmarkedSet = new Set(JSON.parse(localStorage.getItem('vcalc_bookmarked') || '[]'));
    let filterMode = 'all'; // 'all', 'completed', 'bookmarked'

    // -------------------------------------------------------------
    // RENDER FUNCTIONS
    // -------------------------------------------------------------
    
    // Render Left Sidebar Chapter Accordion
    function renderSidebar() {
      const treeContainer = document.getElementById('chapter-tree');
      const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
      treeContainer.innerHTML = '';

      CHAPTERS.forEach(ch => {
        // Filter concepts based on search query or category buttons
        let conceptsInChapter = CONCEPTS_DB.filter(c => c.id >= ch.range[0] && c.id <= ch.range[1]);
        
        if (searchQuery) {
          conceptsInChapter = conceptsInChapter.filter(c => 
            c.title.toLowerCase().includes(searchQuery) || c.id.toString() === searchQuery
          );
        }

        if (filterMode === 'completed') {
          conceptsInChapter = conceptsInChapter.filter(c => completedSet.has(c.id));
        } else if (filterMode === 'bookmarked') {
          conceptsInChapter = conceptsInChapter.filter(c => bookmarkedSet.has(c.id));
        }

        if (conceptsInChapter.length === 0 && (searchQuery || filterMode !== 'all')) return;

        const chapterDiv = document.createElement('div');
        chapterDiv.className = 'border border-slate-200 dark:border-slate-700/60 rounded-xl overflow-hidden bg-slate-50/50 dark:bg-slate-800/40 mb-2';

        const isExpanded = true; // Keep chapters open for smooth UX
        
        chapterDiv.innerHTML = `
          <button class="w-full px-3 py-2.5 text-left font-semibold text-xs text-slate-700 dark:text-slate-200 flex justify-between items-center bg-slate-100/80 dark:bg-slate-700/50 hover:bg-slate-200/60 dark:hover:bg-slate-700 transition-colors">
            <span class="truncate pr-2">${ch.title}</span>
            <span class="text-[10px] font-normal px-2 py-0.5 bg-slate-200 dark:bg-slate-600 rounded-full text-slate-600 dark:text-slate-300">${conceptsInChapter.length}</span>
          </button>
          <div class="p-1 space-y-1 ${isExpanded ? '' : 'hidden'}">
            ${conceptsInChapter.map(c => {
              const isCompleted = completedSet.has(c.id);
              const isBookmarked = bookmarkedSet.has(c.id);
              const isActive = c.id === activeConceptId;

              return `
                <div onclick="selectConcept(${c.id})" class="flex items-center justify-between px-2.5 py-1.5 rounded-lg text-xs cursor-pointer transition-all ${
                  isActive 
                    ? 'bg-indigo-600 text-white font-medium shadow-md shadow-indigo-500/20' 
                    : 'hover:bg-slate-200/50 dark:hover:bg-slate-700/60 text-slate-600 dark:text-slate-300'
                }">
                  <div class="flex items-center space-x-2 truncate pr-1">
                    <span class="w-2 h-2 rounded-full ${isCompleted ? 'bg-emerald-400' : 'bg-slate-300 dark:bg-slate-600'}"></span>
                    <span class="truncate">${c.title}</span>
                  </div>
                  <div class="flex items-center space-x-1 shrink-0">
                    ${isBookmarked ? `<i class="fa-solid fa-bookmark text-amber-400 text-[10px]"></i>` : ''}
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;

        treeContainer.appendChild(chapterDiv);
      });

      updateStats();
    }

    // Render Detailed Main Concept Card View
    function renderConceptView() {
      const container = document.getElementById('concept-view-container');
      const concept = CONCEPTS_DB.find(c => c.id === activeConceptId);
      if (!concept) return;

      const isCompleted = completedSet.has(concept.id);
      const isBookmarked = bookmarkedSet.has(concept.id);

      container.innerHTML = `
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 sm:p-8 shadow-xl border border-slate-200 dark:border-slate-700/80 transition-all">
          
          <!-- Concept Header & Actions -->
          <div class="flex flex-wrap items-center justify-between gap-4 pb-6 border-b border-slate-100 dark:border-slate-700/60">
            <div>
              <span class="text-xs font-bold uppercase tracking-wider text-indigo-600 dark:text-indigo-400">개념 ${concept.id} / 100</span>
              <h2 class="text-2xl sm:text-3xl font-extrabold text-slate-900 dark:text-white mt-1">${concept.title}</h2>
            </div>

            <div class="flex items-center space-x-3">
              <button onclick="toggleBookmark(${concept.id})" class="px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition-colors ${
                isBookmarked 
                  ? 'bg-amber-100 text-amber-700 dark:bg-amber-900/40 dark:text-amber-300' 
                  : 'bg-slate-100 text-slate-600 dark:bg-slate-700 dark:text-slate-300 hover:bg-slate-200'
              }">
                <i class="fa-${isBookmarked ? 'solid' : 'regular'} fa-bookmark"></i>
                <span>${isBookmarked ? '북마크됨' : '북마크'}</span>
              </button>

              <button onclick="toggleCompleted(${concept.id})" class="px-4 py-2 rounded-xl text-xs font-bold flex items-center space-x-2 transition-all ${
                isCompleted 
                  ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-500/30' 
                  : 'bg-indigo-600 text-white hover:bg-indigo-700 shadow-lg shadow-indigo-500/20'
              }">
                <i class="fa-solid ${isCompleted ? 'fa-circle-check' : 'fa-check'}"></i>
                <span>${isCompleted ? '학습 완료됨' : '학습 완료 표시'}</span>
              </button>
            </div>
          </div>

          <!-- Concept Content Body Grid -->
          <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 my-6">
            
            <!-- Left 2 Cols: Definition & Formulas -->
            <div class="lg:col-span-2 space-y-4">
              <h3 class="text-base font-bold text-slate-900 dark:text-slate-100 flex items-center">
                <i class="fa-solid fa-book-open text-indigo-500 mr-2"></i> 개념 정의 및 수학적 정식화
              </h3>
              <div class="p-5 bg-slate-50 dark:bg-slate-900/60 rounded-xl text-sm leading-relaxed text-slate-700 dark:text-slate-300 border border-slate-100 dark:border-slate-800">
                ${concept.definition}
              </div>
            </div>

            <!-- Right 1 Col: Visual SVG Graphic -->
            <div class="flex flex-col justify-center space-y-2">
              <h3 class="text-base font-bold text-slate-900 dark:text-slate-100 flex items-center">
                <i class="fa-solid fa-chart-line text-indigo-500 mr-2"></i> 시각적 도해
              </h3>
              <div class="p-2 bg-slate-900 rounded-xl overflow-hidden border border-slate-800 flex items-center justify-center">
                ${generateConceptSVG(concept.id, concept.title)}
              </div>
            </div>
          </div>

          <!-- Examples & Problem Solving Section -->
          <div class="space-y-6 pt-4">
            
            <!-- Basic Concept Example Card -->
            <div class="p-5 bg-indigo-50/50 dark:bg-indigo-950/20 rounded-2xl border border-indigo-100 dark:border-indigo-900/40">
              <div class="flex items-center justify-between mb-3">
                <span class="px-3 py-1 bg-indigo-600 text-white rounded-full text-[11px] font-bold">기본 개념 예제</span>
              </div>
              <p class="text-sm font-semibold text-slate-800 dark:text-slate-200 mb-3">${concept.example.q}</p>
              
              <div class="pt-3 border-t border-indigo-100 dark:border-indigo-900/40 text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                ${concept.example.a}
              </div>
            </div>

            <!-- Applied Real-World Problem Card -->
            <div class="p-5 bg-emerald-50/50 dark:bg-emerald-950/20 rounded-2xl border border-emerald-100 dark:border-emerald-900/40">
              <div class="flex items-center justify-between mb-3">
                <span class="px-3 py-1 bg-emerald-600 text-white rounded-full text-[11px] font-bold">실생활 / 과학 응용 심화 문제</span>
              </div>
              <p class="text-sm font-semibold text-slate-800 dark:text-slate-200 mb-3">${concept.applied.q}</p>
              
              <div class="pt-3 border-t border-emerald-100 dark:border-emerald-900/40 text-xs sm:text-sm text-slate-700 dark:text-slate-300 leading-relaxed">
                ${concept.applied.a}
              </div>
            </div>

          </div>

          <!-- Navigation Footer (Previous / Next Concept) -->
          <div class="flex items-center justify-between mt-8 pt-6 border-t border-slate-100 dark:border-slate-700/60">
            <button onclick="navigateConcept(-1)" ${concept.id === 1 ? 'disabled' : ''} class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
              <i class="fa-solid fa-arrow-left mr-1"></i> 이전 개념
            </button>
            <span class="text-xs text-slate-400">${concept.id} / 100</span>
            <button onclick="navigateConcept(1)" ${concept.id === 100 ? 'disabled' : ''} class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 text-slate-700 dark:text-slate-200 rounded-xl text-xs font-semibold disabled:opacity-40 disabled:cursor-not-allowed transition-colors">
              다음 개념 <i class="fa-solid fa-arrow-right ml-1"></i>
            </button>
          </div>

        </div>
      `;

      // Trigger MathJax re-render for new content
      if (window.MathJax && window.MathJax.typesetPromise) {
        window.MathJax.typesetPromise();
      }
    }

    // Update Progress Counter & LocalStorage
    function updateStats() {
      document.getElementById('completed-count').innerText = completedSet.size;
      const percent = Math.round((completedSet.size / 100) * 100);
      document.getElementById('progress-percent').innerText = `${percent}%`;

      localStorage.setItem('vcalc_completed', JSON.stringify(Array.from(completedSet)));
      localStorage.setItem('vcalc_bookmarked', JSON.stringify(Array.from(bookmarkedSet)));
    }

    // -------------------------------------------------------------
    // INTERACTION HANDLERS
    // -------------------------------------------------------------
    function selectConcept(id) {
      activeConceptId = id;
      renderSidebar();
      renderConceptView();
      // Close mobile drawer on selection
      document.getElementById('sidebar').classList.add('-translate-x-full');
      document.getElementById('sidebar-overlay').classList.add('hidden');
    }

    function toggleCompleted(id) {
      if (completedSet.has(id)) {
        completedSet.delete(id);
      } else {
        completedSet.add(id);
      }
      renderSidebar();
      renderConceptView();
    }

    function toggleBookmark(id) {
      if (bookmarkedSet.has(id)) {
        bookmarkedSet.delete(id);
      } else {
        bookmarkedSet.add(id);
      }
      renderSidebar();
      renderConceptView();
    }

    function navigateConcept(delta) {
      const nextId = activeConceptId + delta;
      if (nextId >= 1 && nextId <= 100) {
        selectConcept(nextId);
      }
    }

    // -------------------------------------------------------------
    // EVENT LISTENERS INITIALIZATION
    // -------------------------------------------------------------
    window.addEventListener('DOMContentLoaded', () => {
      renderSidebar();
      renderConceptView();

      // Theme toggle
      const themeBtn = document.getElementById('theme-toggle');
      themeBtn.addEventListener('click', () => {
        document.documentElement.classList.toggle('dark');
      });

      // Search listeners
      const searchInput = document.getElementById('search-input');
      const clearSearchBtn = document.getElementById('clear-search');

      searchInput.addEventListener('input', (e) => {
        if (e.target.value) {
          clearSearchBtn.classList.remove('hidden');
        } else {
          clearSearchBtn.classList.add('hidden');
        }
        renderSidebar();
      });

      clearSearchBtn.addEventListener('click', () => {
        searchInput.value = '';
        clearSearchBtn.classList.add('hidden');
        renderSidebar();
      });

      // Filter Mode Buttons
      document.getElementById('filter-all').addEventListener('click', function() {
        filterMode = 'all';
        renderSidebar();
      });
      document.getElementById('filter-completed').addEventListener('click', function() {
        filterMode = 'completed';
        renderSidebar();
      });
      document.getElementById('filter-bookmarked').addEventListener('click', function() {
        filterMode = 'bookmarked';
        renderSidebar();
      });

      // Reset progress
      document.getElementById('btn-reset-progress').addEventListener('click', () => {
        if (confirm('학습 진행 상태를 모두 초기화하시겠습니까?')) {
          completedSet.clear();
          bookmarkedSet.clear();
          renderSidebar();
          renderConceptView();
        }
      });

      // Mobile drawer sidebar toggle
      const toggleMobileBtn = document.getElementById('toggle-sidebar-mobile');
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('sidebar-overlay');

      toggleMobileBtn.addEventListener('click', () => {
        sidebar.classList.toggle('-translate-x-full');
        overlay.classList.toggle('hidden');
      });

      overlay.addEventListener('click', () => {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      });
    });
  </script>
</body>
</html>
