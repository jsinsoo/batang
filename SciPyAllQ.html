const DATA=[{"id": 1, "name": "constants.pi", "group": "상수·특수함수", "desc": "원주율 π를 고정밀 부동소수점 상수로 제공합니다.", "code": "import numpy as np\nfrom scipy import constants\n\nradius = 3.0\ndiameter = 2 * radius\ncircumference = 2 * constants.pi * radius\narea = constants.pi * radius**2\nprint(\"지름:\", diameter)\nprint(\"둘레:\", round(circumference, 3))\nprint(\"넓이:\", round(area, 3))", "output": "지름: 6.0\n둘레: 18.85\n넓이: 28.274", "options": [{"t": "반지름이 3이므로 지름은 6이다.", "ok": true, "why": "반지름이 3이므로 지름은 6이다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "반지름을 두 배로 늘리면 원의 넓이는 네 배가 된다.", "ok": true, "why": "반지름을 두 배로 늘리면 원의 넓이는 네 배가 된다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "이 코드에서 둘레를 구할 때 원주율 대신 3을 사용한다.", "ok": false, "why": "원주율은 원의 둘레를 지름으로 나눈 비율이다."}, {"t": "원의 넓이는 πr²이므로 약 28.274이다.", "ok": true, "why": "원의 넓이는 πr²이므로 약 28.274이다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "원의 둘레는 반지름에 2π를 곱하여 구한다.", "ok": true, "why": "원의 둘레는 반지름에 2π를 곱하여 구한다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}]}, {"id": 2, "name": "constants.c", "group": "상수·특수함수", "desc": "진공에서 빛의 속도를 SI 단위 m/s로 나타냅니다.", "code": "import numpy as np\nfrom scipy import constants\n\ndistance_km = 384400\nspeed_km_s = constants.c / 1000\ntravel_seconds = distance_km / speed_km_s\nprint(\"광속(km/s):\", round(speed_km_s, 1))\nprint(\"달까지 빛의 이동 시간(초):\", round(travel_seconds, 3))\nprint(\"1초 동안의 이동 거리(km):\", round(speed_km_s, 1))", "output": "광속(km/s): 299792.5\n달까지 빛의 이동 시간(초): 1.282\n1초 동안의 이동 거리(km): 299792.5", "options": [{"t": "constants.c는 진공의 광속을 m/s 단위로 나타낸다.", "ok": true, "why": "constants.c는 진공의 광속을 m/s 단위로 나타낸다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "지구와 달 사이 거리는 예제에서 384400km로 가정한다.", "ok": true, "why": "지구와 달 사이 거리는 예제에서 384400km로 가정한다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "이 코드의 travel_seconds는 거리와 속력을 곱해서 계산한다.", "ok": false, "why": "constants.c는 진공에서의 광속을 나타내는 정의된 상수다."}, {"t": "거리(km)를 속력(km/s)으로 나누면 시간이 초로 나온다.", "ok": true, "why": "거리(km)를 속력(km/s)으로 나누면 시간이 초로 나온다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "1000으로 나누면 km/s 단위가 된다.", "ok": true, "why": "1000으로 나누면 km/s 단위가 된다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}]}, {"id": 3, "name": "constants.h", "group": "상수·특수함수", "desc": "플랑크 상수를 J·s 단위로 제공합니다.", "code": "import numpy as np\nfrom scipy import constants\n\nfrequency = 5.0e14\nenergy_joule = constants.h * frequency\nenergy_ev = energy_joule / constants.e\nwavelength = constants.c / frequency\nprint(\"광자 에너지(J):\", f\"{energy_joule:.3e}\")\nprint(\"광자 에너지(eV):\", round(energy_ev, 3))\nprint(\"파장(nm):\", round(wavelength * 1e9, 1))", "output": "광자 에너지(J): 3.313e-19\n광자 에너지(eV): 2.068\n파장(nm): 599.6", "options": [{"t": "줄을 전자볼트로 바꿀 때 전자 전하량의 크기로 나눈다.", "ok": true, "why": "줄을 전자볼트로 바꿀 때 전자 전하량의 크기로 나눈다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "파장은 광속을 주파수로 나누어 구한다.", "ok": true, "why": "파장은 광속을 주파수로 나누어 구한다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "주파수가 두 배가 되면 광자 한 개의 에너지는 절반으로 감소한다.", "ok": false, "why": "플랑크 상수의 단위는 J·s다."}, {"t": "광자 한 개의 에너지는 E=hf로 계산한다.", "ok": true, "why": "광자 한 개의 에너지는 E=hf로 계산한다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "주파수의 단위는 Hz, 플랑크 상수의 단위는 J·s다.", "ok": true, "why": "주파수의 단위는 Hz, 플랑크 상수의 단위는 J·s다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}]}, {"id": 4, "name": "constants.G", "group": "상수·특수함수", "desc": "만유인력 상수를 SI 단위로 제공합니다.", "code": "import numpy as np\nfrom scipy import constants\n\nmass_earth = 5.972e24\nmass_object = 70.0\nradius_earth = 6.371e6\nforce = constants.G * mass_earth * mass_object / radius_earth**2\nacceleration = force / mass_object\nprint(\"중력(N):\", round(force, 2))\nprint(\"중력가속도(m/s²):\", round(acceleration, 3))", "output": "중력(N): 687.4\n중력가속도(m/s²): 9.82", "options": [{"t": "힘을 물체의 질량으로 나누면 중력가속도가 된다.", "ok": true, "why": "힘을 물체의 질량으로 나누면 중력가속도가 된다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "70kg 물체의 중력은 G·M·m/r²로 계산한다.", "ok": true, "why": "70kg 물체의 중력은 G·M·m/r²로 계산한다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "거리의 제곱이 분모에 있으므로 거리가 두 배면 힘은 1/4이다.", "ok": true, "why": "거리의 제곱이 분모에 있으므로 거리가 두 배면 힘은 1/4이다. 해당 예제의 함수 정의와 연산 관계에 맞는다."}, {"t": "이 코드에서 constants.G는 지표면의 중력가속도 9.8을 뜻한다.", "ok": false, "why": "G는 뉴턴의 const answers={};let graded=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qs=document.getElementById('questions');const group=document.getElementById('group');
[...new Set(DATA.map(q=>q.group))].forEach(g=>{let e=document.createElement('option');e.value=g;e.textContent=g;group.appendChild(e)});
qs.innerHTML=DATA.map(q=>`<article class="question" id="q${q.id}" data-group="${esc(q.group)}" data-search="${esc((q.name+' '+q.desc).toLowerCase())}"><h3>문항 ${q.id}. ${esc(q.name)} <span class="pill">1점</span></h3><div class="meta">${esc(q.group)}</div><p>${esc(q.desc)}</p><pre><code>${esc(q.code)}</code></pre><div class="actions"><button onclick="copyCode(${q.id})">📋 코드 복사</button><button onclick="toggleOutput(${q.id})">🖥 출력결과 보기 / 닫기</button></div><pre class="output hide" id="out${q.id}">${esc(q.output)}</pre><p><b>다음 코드에 대한 옳은 설명 4개를 모두 고르시오.</b></p><div class="opts">${q.options.map((o,j)=>`<label class="opt" id="opt${q.id}_${j}"><input type="checkbox" onchange="answerChanged(${q.id},${j},this.checked)" id="check${q.id}_${j}"><span><b>${'①②③④⑤'[j]}</b> ${esc(o.t)}<small class="hide" id="why${q.id}_${j}">${esc(o.why)}</small></span></label>`).join('')}</div><div class="hint hide" id="detail${q.id}"></div></article>`).join('');
function copyCode(id){const code=DATA[id-1].code;if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(code).then(()=>alert('코드가 복사되었습니다.')).catch(()=>fallback(code))}else fallback(code)}
function fallback(text){const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove();alert('코드가 복사되었습니다.')}
function toggleOutput(id){document.getElementById('out'+id).classList.toggle('hide')}
function showAllOutputs(){DATA.forEach(q=>document.getElementById('out'+q.id).classList.remove('hide'))}
function hideAllOutputs(){DATA.forEach(q=>document.getElementById('out'+q.id).classList.add('hide'))}
function answerChanged(id,j,on){if(graded)return;answers[id]??=[];answers[id][j]=on;progress()}

function filterQuestions(){let term=document.getElementById('search').value.toLowerCase().trim(),g=group.value;document.querySelectorAll('.question').forEach(e=>e.classList.toggle('hide',!!(g&&e.dataset.group!==g)||!!(term&&!e.dataset.search.includes(term))))}
function grade(){if(graded){alert('이미 채점했습니다.');return}if(!confirm('전체 142문항을 채점하시겠습니까?'))return;graded=true;let score=0;DATA.forEach(q=>{const a=answers[q.id]||[];const good=q.options.every((o,j)=>!!a[j]===o.ok);if(good)score++;for(let j=0;j<5;j++){let label=document.getElementById(`opt${q.id}_${j}`);label.classList.add(q.options[j].ok?'correct':'incorrect');document.getElementById(`why${q.id}_${j}`).classList.remove('hide');document.getElementById(`check${q.id}_${j}`).disabled=true}let d=document.getElementById('detail'+q.id);d.classList.remove('hide');d.textContent=good?'정답 · 1점':'오답 · 0점 (초록색이 옳은 보기입니다.)'});window.finalScore=score;document.getElementById('score').innerHTML=`<p class="score">최종 점수: ${score} / 142점 (${(score/142*100).toFixed(1)}%)</p>`;window.scrollTo({top:0,behavior:'smooth'})}
function saveReport(){if(!graded){alert('먼저 채점하세요.');return}const student=document.getElementById('student').value.trim()||'학번미입력',name=document.getElementById('name').value.trim()||'이름미입력',dt=new Date(),stamp=[dt.getFullYear(),String(dt.getMonth()+1).padStart(2,'0'),String(dt.getDate()).padStart(2,'0')].join('')+'_'+[dt.getHours(),dt.getMinutes(),dt.getSeconds()].map(x=>String(x).padStart(2,'0')).join('');const rows=[`SciPy 142문항 코드 분석 평가`,`학번: ${student}`,`이름: ${name}`,`점수: ${window.finalScore}/142`,`응시시각: ${dt.toLocaleString('ko-KR')}`,''];DATA.forEach(q=>{let selected=q.options.map((o,j)=>(answers[q.id]||[])[j]?j+1:null).filter(Boolean);let correct=q.options.map((o,j)=>o.ok?j+1:null).filter(Boolean);rows.push(`${q.id}. ${q.name} | 선택: ${selected.join(',')||'없음'} | 정답: ${correct.join(',')} | ${selected.length===4&&selected.every(x=>correct.includes(x))?'1점':'0점'}`)});const blob=new Blob(['\ufeff'+rows.join('\n')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`${student}_${name}_${window.finalScore}점_SciPy_${stamp}.txt`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
